<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 150px);
    }

    .model-btn {
      padding: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s, border-color 0.2s;
    }

    .model-btn:hover {
      border-color: var(--accent);
      background: #1e293b;
    }

    .badge-live {
      font-size: 0.75rem;
      background: var(--accent);
      padding: 3px 8px;
      border-radius: 4px;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .models-list { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <iframe 
          src="https://chaturbate.com/in/?tour=mL83&camp=default&track=default&room=dreamsweetgirl" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Modèles</h2>
      <div class="models-list">

        <button class="model-btn" onclick="loadModel('dreamsweetgirl')">
          <span>dreamsweetgirl</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('cutefacebigass')">
          <span>cutefacebigass</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('sweet_sugar87')">
          <span>sweet_sugar87</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('ellyrockstar')">
          <span>ellyrockstar</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('pinkcouplexo')">
          <span>pinkcouplexo</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('julcy_peach')">
          <span>julcy_peach</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('shiny_lily')">
          <span>shiny_lily</span>
          <span class="badge-live">LIVE</span>
        </button>

        <button class="model-btn" onclick="loadModel('olsenspring')">
          <span>olsenspring</span>
          <span class="badge-live">LIVE</span>
        </button>

      </div>
    </aside>
  </div>

  <script>
    function loadModel(username) {
      const player = document.getElementById('player');
      // URL standard autorisée par la plateforme
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/in/?tour=mL83&camp=default&track=default&room=${encodeURIComponent(username)}" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
