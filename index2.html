<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    h1 { 
      font-size: 1.5rem; 
      margin-bottom: 16px;
    }

    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    /* Style de la liste déroulante */
    .model-select {
      width: 100%;
      padding: 12px 16px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .model-select:focus, .model-select:hover {
      border-color: var(--accent);
    }

    .model-select option {
      background: var(--card-bg);
      color: var(--text);
      padding: 10px;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
    
    <div class="controls-bar">
      <label for="modelSelect">Choisir un modèle :</label>
      <select id="modelSelect" class="model-select" onchange="changeModel(this.value)">
        <option value="dreamsweetgirl">dreamsweetgirl</option>
        <option value="cutefacebigass">cutefacebigass</option>
        <option value="sweet_sugar87">sweet_sugar87</option>
        <option value="ellyrockstar">ellyrockstar</option>
        <option value="pinkcouplexo">pinkcouplexo</option>
        <option value="julcy_peach">julcy_peach</option>
        <option value="shiny_lily">shiny_lily</option>
        <option value="olsenspring">olsenspring</option>
      </select>
    </div>
  </header>

  <main class="main-container">
    <div class="player-container" id="player">
      <iframe 
        src="https://chaturbate.com/embed/dreamsweetgirl/" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <script>
    function changeModel(username) {
      const player = document.getElementById('player');
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
