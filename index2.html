<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.5rem; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .model-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .model-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      background: #0f172a;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .model-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .badge {
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-watch {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-watch:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live Chaturbate</h1>
  </header>

  <div class="grid-container">

    <!-- Modèle 1 -->
    <div class="model-card">
      <div class="card-header">
        <span class="model-name">sweet_statue</span>
        <span class="badge">EN DIRECT</span>
      </div>
      <div class="card-body">
        <a href="https://chaturbate.com/in/?tour=mL83&camp=default&track=default&room=sweet_statue" target="_blank" rel="noopener" class="btn-watch">
          Rejoindre le Live
        </a>
      </div>
    </div>

    <!-- Modèle 2 -->
    <div class="model-card">
      <div class="card-header">
        <span class="model-name">olsenspring</span>
        <span class="badge">EN DIRECT</span>
      </div>
      <div class="card-body">
        <a href="https://chaturbate.com/in/?tour=mL83&camp=default&track=default&room=olsenspring" target="_blank" rel="noopener" class="btn-watch">
          Rejoindre le Live
        </a>
      </div>
    </div>

  </div>

</body>
</html>
