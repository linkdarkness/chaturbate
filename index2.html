<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 150px);
    }

    .model-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .model-card:hover {
      border-color: var(--accent);
      background: #1e293b;
    }

    .thumb-container {
      width: 100px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    .thumb-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .model-name {
      font-weight: bold;
      font-size: 0.95rem;
      word-break: break-all;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .models-list { max-height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <iframe 
          src="https://chaturbate.com/embed/dreamsweetgirl/" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Modèles</h2>
      <div class="models-list">

        <div class="model-card" onclick="loadModel('dreamsweetgirl')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/dreamsweetgirl.jpg" alt="dreamsweetgirl">
          </div>
          <span class="model-name">dreamsweetgirl</span>
        </div>

        <div class="model-card" onclick="loadModel('cutefacebigass')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/cutefacebigass.jpg" alt="cutefacebigass">
          </div>
          <span class="model-name">cutefacebigass</span>
        </div>

        <div class="model-card" onclick="loadModel('sweet_sugar87')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/sweet_sugar87.jpg" alt="sweet_sugar87">
          </div>
          <span class="model-name">sweet_sugar87</span>
        </div>

        <div class="model-card" onclick="loadModel('ellyrockstar')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/ellyrockstar.jpg" alt="ellyrockstar">
          </div>
          <span class="model-name">ellyrockstar</span>
        </div>

        <div class="model-card" onclick="loadModel('pinkcouplexo')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/pinkcouplexo.jpg" alt="pinkcouplexo">
          </div>
          <span class="model-name">pinkcouplexo</span>
        </div>

        <div class="model-card" onclick="loadModel('julcy_peach')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/julcy_peach.jpg" alt="julcy_peach">
          </div>
          <span class="model-name">julcy_peach</span>
        </div>

        <div class="model-card" onclick="loadModel('shiny_lily')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/shiny_lily.jpg" alt="shiny_lily">
          </div>
          <span class="model-name">shiny_lily</span>
        </div>

        <div class="model-card" onclick="loadModel('olsenspring')">
          <div class="thumb-container">
            <img src="https://wsrv.nl/?url=roomimg.stream.highwebmedia.com/ri/olsenspring.jpg" alt="olsenspring">
          </div>
          <span class="model-name">olsenspring</span>
        </div>

      </div>
    </aside>
  </div>

  <script>
    function loadModel(username) {
      const player = document.getElementById('player');
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
