<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
      --online: #22c55e;
      --offline: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 150px);
    }

    .model-btn {
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s, border-color 0.2s;
    }

    .model-btn:hover {
      border-color: var(--accent);
      background: #1e293b;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: normal;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--offline);
      border-radius: 50%;
      transition: background-color 0.3s;
    }

    .live-dot.online {
      background-color: var(--online);
      box-shadow: 0 0 6px var(--online);
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .models-list { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <iframe 
          src="https://chaturbate.com/embed/dreamsweetgirl/" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Modèles</h2>
      <div class="models-list">

        <button class="model-btn" data-username="dreamsweetgirl" onclick="loadModel('dreamsweetgirl')">
          <span>Dreamsweetgirl</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="cutefacebigass" onclick="loadModel('cutefacebigass')">
          <span>cutefacebigass</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="sweet_sugar87" onclick="loadModel('sweet_sugar87')">
          <span>sweet_sugar87</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="ellyrockstar" onclick="loadModel('ellyrockstar')">
          <span>ellyrockstar</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="pinkcouplexo" onclick="loadModel('pinkcouplexo')">
          <span>pinkcouplexo</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="julcy_peach" onclick="loadModel('julcy_peach')">
          <span>julcy_peach</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="shiny_lily" onclick="loadModel('shiny_lily')">
          <span>shiny_lily</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

        <button class="model-btn" data-username="olsenspring" onclick="loadModel('olsenspring')">
          <span>olsenspring</span>
          <div class="status-container">
            <span class="status-text">Test...</span>
            <span class="live-dot"></span>
          </div>
        </button>

      </div>
    </aside>
  </div>

  <script>
    function loadModel(username) {
      const player = document.getElementById('player');
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }

    function checkModelsStatus() {
      const buttons = document.querySelectorAll('.model-btn');

      buttons.forEach(btn => {
        const username = btn.getAttribute('data-username');
        const dot = btn.querySelector('.live-dot');
        const statusText = btn.querySelector('.status-text');

        if (!username) return;

        const img = new Image();
        // Utilisation du relai weserv.nl pour passer la sécurité CORS du navigateur
        const targetUrl = `https://cbjpeg.stream.highwebmedia.com/stream?room=${username}`;
        img.src = `https://images.weserv.nl/?url=${encodeURIComponent(targetUrl)}&t=${Date.now()}`;

        img.onload = () => {
          dot.classList.add('online');
          statusText.textContent = 'En ligne';
          statusText.style.color = '#22c55e';
        };

        img.onerror = () => {
          dot.classList.remove('online');
          statusText.textContent = 'Hors ligne';
          statusText.style.color = '#64748b';
        };
      });
    }

    document.addEventListener('DOMContentLoaded', checkModelsStatus);
  </script>

</body>
</html>
