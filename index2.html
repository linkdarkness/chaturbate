<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 150px);
    }

    .model-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .model-card:hover {
      border-color: var(--accent);
    }

    .thumb-wrapper {
      position: relative;
      width: 80px;
      height: 60px;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .live-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: var(--accent);
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .model-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-name {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .model-status {
      font-size: 0.75rem;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .models-list { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <!-- Modèle chargé par défaut -->
        <iframe 
          src="https://chaturbate.com/embed/sweet_statue/" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Sélectionner un Modèle</h2>
      <div class="models-list">

        <!-- Modèle 1 (Remplace par le pseudo réel) -->
        <div class="model-card" onclick="loadModel('sweet_statue')">
          <div class="thumb-wrapper">
            <img src="https://roomimg.stream.highwebmedia.com/ri/sweet_statue.jpg" alt="sweet_statue" onerror="this.src='https://ssl.cdn-chaturbate.com/static/default_profile.gif'">
            <span class="live-badge">Live</span>
          </div>
          <div class="model-info">
            <span class="model-name">sweet_statue</span>
            <span class="model-status"><span class="status-dot"></span> Regarder le flux</span>
          </div>
        </div>

        <!-- Modèle 2 -->
        <div class="model-card" onclick="loadModel('shiny_lily)">
          <div class="thumb-wrapper">
            <img src="https://roomimg.stream.highwebmedia.com/ri/shiny_lily.jpg" alt="mistress_k" onerror="this.src='https://ssl.cdn-chaturbate.com/static/default_profile.gif'">
            <span class="live-badge">Live</span>
          </div>
          <div class="model-info">
            <span class="model-name">shiny_lily</span>
            <span class="model-status"><span class="status-dot"></span> Regarder le flux</span>
          </div>
        </div>

      </div>
    </aside>
  </div>

  <script>
    function loadModel(username) {
      const player = document.getElementById('player');
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
