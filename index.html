<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --star: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
      --grid-cols: repeat(auto-fill, minmax(360px, 1fr));
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 10px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 { 
      font-size: 1.15rem; 
      font-weight: 700; 
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-form {
      display: flex;
      gap: 4px;
    }

    .custom-input {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-add:hover {
      background: #0369a1;
    }

    .btn-mini {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 29px;
      transition: all 0.2s ease;
    }

    .btn-mini:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-fav-filter.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--star);
      color: var(--star);
      font-weight: 600;
    }

    .btn-sort.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Sélecteur de colonnes compact */
    .layout-selector {
      display: flex;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .layout-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 7px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layout-btn:hover {
      color: var(--text);
    }

    .layout-btn.active {
      background: var(--border);
      color: var(--accent);
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: var(--grid-cols);
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .model-card.hidden {
      display: none !important;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-name {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Bouton favori et supprimer */
    .btn-fav {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease, transform 0.1s ease;
    }

    .btn-fav:active {
      transform: scale(1.2);
    }

    .btn-fav.is-favorite {
      color: var(--star);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: var(--card-bg);
    }

    /* Player Iframe avec Rognage strict */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    .drag-preventer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    /* Design Réponsif */
    @media (max-width: 768px) {
      .layout-selector {
        display: none;
      }
    }

    @media (max-width: 520px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-group {
        justify-content: space-between;
      }
      .input-form {
        width: 100%;
      }
      .custom-input {
        flex: 1;
      }
      .grid-container {
        grid-template-columns: 1fr !important;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    
    <div class="controls-group">
      <!-- Formulaire d'ajout -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo du modèle..." 
          required
          autocomplete="off"
        >
        <button type="submit" class="btn-add">+ Ajouter</button>
      </form>

      <!-- Mini-bouton Réinitialiser (Reset) -->
      <button id="resetBtn" class="btn-mini btn-reset" title="Réinitialiser la liste (Reset)">
        ↺
      </button>

      <!-- Mini-bouton Tri Alphabétique -->
      <button id="sortBtn" class="btn-mini btn-sort" title="Changer l'ordre de tri">
        <span id="sortLabel">A-Z</span>
      </button>

      <!-- Mini-bouton Filtre Favoris -->
      <button id="favFilterBtn" class="btn-mini btn-fav-filter" title="Afficher uniquement les favoris">
        ★
      </button>

      <!-- Barre de recherche -->
      <input 
        type="text" 
        id="searchInput" 
        class="custom-input" 
        placeholder="Filtrer..."
        autocomplete="off"
        style="width: 110px;"
      >

      <!-- Sélecteur de colonnes -->
      <div class="layout-selector">
        <button class="layout-btn" data-cols="auto">Auto</button>
        <button class="layout-btn" data-cols="1">1</button>
        <button class="layout-btn" data-cols="2">2</button>
        <button class="layout-btn" data-cols="3">3</button>
        <button class="layout-btn" data-cols="4">4</button>
      </div>
    </div>
  </header>

  <!-- Grille principale -->
  <main class="grid-container" id="grid"></main>

  <script>
    const defaultModels = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    // Persistence du state local
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [...defaultModels];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let sortDirection = localStorage.getItem('cb_dashboard_sort') || 'asc'; // 'asc' = A-Z, 'desc' = Z-A
    let selectedLayout = localStorage.getItem('cb_dashboard_cols') || 'auto';
    let showOnlyFavorites = false;

    // Éléments du DOM
    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const resetBtn = document.getElementById('resetBtn');
    const sortBtn = document.getElementById('sortBtn');
    const sortLabel = document.getElementById('sortLabel');
    const favFilterBtn = document.getElementById('favFilterBtn');
    const searchInput = document.getElementById('searchInput');
    const layoutBtns = document.querySelectorAll('.layout-btn');

    function saveModels() {
      localStorage.setItem('cb_dashboard_models', JSON.stringify(models));
    }

    function saveFavorites() {
      localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites));
    }

    function saveSort() {
      localStorage.setItem('cb_dashboard_sort', sortDirection);
    }

    function saveLayout(cols) {
      localStorage.setItem('cb_dashboard_cols', cols);
    }

    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    };

    // Création de la carte modèle avec rognage strict
    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);

      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('data-username', lower);
      card.setAttribute('data-fav', isFav ? 'true' : 'false');

      card.innerHTML = `
        <div class="model-header">
          <div class="header-left">
            <span class="model-name">${username}</span>
          </div>
          <div class="header-actions">
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Favori" onclick="toggleFavorite('${username}')">★</button>
            <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
          </iframe>
          <div class="drag-preventer"></div>
        </div>
      `;
      return card;
    }

    function renderGrid() {
      grid.innerHTML = '';

      const sortedModels = [...models].sort((a, b) => {
        const aFav = favorites.includes(a.toLowerCase());
        const bFav = favorites.includes(b.toLowerCase());

        // 1. Les favoris restent toujours en premier
        if (aFav && !bFav) return -1;
        if (!aFav && bFav) return 1;

        // 2. Tri alphabétique (asc = A-Z, desc = Z-A)
        const comp = a.localeCompare(b, undefined, { sensitivity: 'base' });
        return sortDirection === 'asc' ? comp : -comp;
      });

      sortedModels.forEach(username => {
        grid.appendChild(createCard(username));
      });

      applyFilters();
    }

    // Basculer le sens du tri alphabétique A-Z / Z-A
    sortBtn.addEventListener('click', () => {
      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      updateSortUI();
      saveSort();
      renderGrid();
    });

    function updateSortUI() {
      sortLabel.textContent = sortDirection === 'asc' ? 'A-Z' : 'Z-A';
      sortBtn.classList.toggle('active', sortDirection === 'desc');
    }

    // Ajout d'un modèle
    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username && !models.map(m => m.toLowerCase()).includes(username.toLowerCase())) {
        models.push(username);
        saveModels();
        renderGrid();
        newModelInput.value = '';
      }
    });

    // Suppression d'un modèle
    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      favorites = favorites.filter(f => f !== lower);
      saveModels();
      saveFavorites();
      renderGrid();
    };

    // Réinitialisation de la liste
    resetBtn.addEventListener('click', () => {
      models = [...defaultModels];
      favorites = [];
      sortDirection = 'asc';
      showOnlyFavorites = false;
      favFilterBtn.classList.remove('active');
      searchInput.value = '';

      localStorage.removeItem('cb_dashboard_models');
      localStorage.removeItem('cb_dashboard_favs');
      localStorage.removeItem('cb_dashboard_sort');
      
      updateSortUI();
      renderGrid();
    });

    // Filtrage favoris
    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      applyFilters();
    });

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const cards = grid.querySelectorAll('.model-card');

      cards.forEach(card => {
        const username = card.getAttribute('data-username');
        const isFav = card.getAttribute('data-fav') === 'true';

        const matchesSearch = username.includes(query);
        const matchesFav = !showOnlyFavorites || isFav;

        if (matchesSearch && matchesFav) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    searchInput.addEventListener('input', applyFilters);

    function applyLayout(cols) {
      layoutBtns.forEach(b => {
        if (b.getAttribute('data-cols') === cols) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });

      if (cols === 'auto') {
        grid.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(360px, 1fr))');
      } else {
        grid.style.setProperty('--grid-cols', `repeat(${cols}, 1fr)`);
      }
    }

    layoutBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cols = btn.getAttribute('data-cols');
        selectedLayout = cols;
        saveLayout(cols);
        applyLayout(cols);
      });
    });

    // Empêcher le drag intempestif
    window.addEventListener('dragstart', (e) => e.preventDefault());

    updateSortUI();
    applyLayout(selectedLayout);
    renderGrid();
  </script>
</body>
</html>
