<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.4rem; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .no-live {
      text-align: center;
      grid-column: 1 / -1;
      color: #94a3b8;
      margin-top: 40px;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <span id="loading-status" style="color: #94a3b8; font-size: 0.9rem;">Vérification des lives...</span>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    // Liste des pseudos à surveiller
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    async function checkAndRenderLives() {
      const grid = document.getElementById('grid');
      const statusText = document.getElementById('loading-status');
      grid.innerHTML = '';
      
      let liveCount = 0;

      for (const username of models) {
        try {
          // Utilisation d'un proxy CORS gratuit pour interroger l'API Chaturbate
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://chaturbate.com/api/chaturbateloaddata/?username=${username}`)}`);
          const data = await res.json();
          const parsedData = JSON.parse(data.contents);

          // Si le modèle est en ligne, on crée et affiche son lecteur
          if (parsedData && parsedData.room_status === 'public') {
            liveCount++;
            const card = document.createElement('div');
            card.className = 'model-card';
            card.innerHTML = `
              <div class="model-header">
                <span class="model-name">${username}</span>
                <span class="live-status"><span class="live-dot"></span> EN DIRECT</span>
              </div>
              <div class="player-container">
                <iframe 
                  src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
                  allow="autoplay; fullscreen" 
                  sandbox="allow-scripts allow-same-origin allow-forms"
                  referrerpolicy="no-referrer-when-downgrade"
                  allowfullscreen>
                </iframe>
              </div>
            `;
            grid.appendChild(card);
          }
        } catch (err) {
          console.error(`Erreur pour ${username}:`, err);
        }
      }

      statusText.textContent = `${liveCount} modèle(s) en direct`;
      
      if (liveCount === 0) {
        grid.innerHTML = `<p class="no-live">Aucun modèle de la liste n'est en direct pour le moment.</p>`;
      }
    }

    // Lancement au chargement de la page
    checkAndRenderLives();
  </script>
</body>
</html>
