<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard Sécurisé</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
      --hidden: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    h1 {
      font-size: 1.1rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
      flex: 1;
      position: relative;
    }

    .custom-input {
      padding: 8px 32px 8px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      flex: 1;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus { border-color: var(--accent); }

    .clear-search-btn {
      position: absolute;
      right: 50px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 6px;
      line-height: 1;
    }
    .clear-search-btn:hover { color: var(--text); }
    .clear-search-btn.show { display: block; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-add:hover { background: #0369a1; border-color: #0369a1; }

    .header-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      flex: 1;
      min-width: 150px;
    }
    .select-tag:hover, .select-tag:focus { border-color: var(--accent); }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-action:hover { color: var(--text); background: #334155; }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-fav-filter.active { background: rgba(251, 191, 36, 0.15); border-color: var(--star); color: var(--star); font-weight: 600; }
    .btn-hide-toggle.active { background: rgba(148, 163, 184, 0.2); border-color: var(--hidden); color: var(--text); font-weight: 600; }
    .btn-sort.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .btn-layout.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }

    .dropdown-menu {
      display: none;
      position: fixed;
      width: 260px;
      max-width: calc(100vw - 20px);
      max-height: 320px;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      z-index: 1000;
    }
    .dropdown-menu.show { display: block; }

    .dropdown-header {
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      border-bottom: 1px solid #334155;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-header-action { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.75rem; }
    .dropdown-header-action:hover { text-decoration: underline; }

    .history-item {
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      gap: 8px;
    }
    .history-item:hover { background: #283548; }
    .history-username { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-username:hover { color: var(--accent); }
    .badge-added { font-size: 0.7rem; background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #64748b; }
    .btn-remove-hist { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; padding: 2px 4px; }
    .btn-remove-hist:hover { color: var(--danger); background: rgba(239, 68, 68, 0.15); }
    .btn-clear-history { width: 100%; padding: 8px; background: transparent; border: none; border-top: 1px solid #334155; color: var(--danger); font-size: 0.75rem; cursor: pointer; text-align: center; }
    .btn-clear-history:hover { background: rgba(239, 68, 68, 0.1); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
    }
    .grid-container.miniature-mode { grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; }
    @media (min-width: 600px) { .grid-container.miniature-mode { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
    .grid-container.miniature-mode .model-header { padding: 4px 6px; }
    .grid-container.miniature-mode .model-name { font-size: 0.75rem; }
    .grid-container.miniature-mode .tags-container { display: none; }

    .empty-message { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748b; font-size: 1rem; }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }
    .model-card.is-hidden { opacity: 0.5; }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .model-title-area { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }

    .model-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .tags-container { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-badge {
      font-size: 0.7rem; background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-badge:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-icon-subtle { background: transparent; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 2px 4px; }
    .btn-icon-subtle:hover { color: var(--text); }
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .btn-fav:hover, .btn-fav.is-favorite { color: var(--star); }
    .btn-delete { background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 2px 4px; }
    .btn-delete:hover { color: var(--danger); }

    .player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .modal-input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <h1>Directs Live</h1>
      <form id="addModelForm" class="input-form">
        <input type="text" id="newModelInput" class="custom-input" placeholder="Ajouter ou chercher un pseudo..." autocomplete="off">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Effacer la recherche">&times;</button>
        <button type="submit" class="btn-add" title="Ajouter ce modèle">+</button>
      </form>
    </div>

    <div class="header-bottom-row">
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ (Tous)</option>
      </select>

      <button id="sortToggleBtn" class="btn-action btn-sort" title="Basculer tri A-Z ou Favoris">🔤 Tri A-Z</button>
      <button id="layoutToggleBtn" class="btn-action btn-layout" title="Changer le mode d'affichage">📐 Mode Standard</button>
      <button id="favFilterBtn" class="btn-action btn-fav-filter" title="Afficher uniquement les favoris">&#9733; Favoris</button>
      
      <button id="hideToggleBtn" class="btn-action btn-hide-toggle" title="Masqués">
        🙈 Masqués <span id="hiddenCount">(0)</span>
      </button>

      <button id="historyBtn" class="btn-action" title="Historique">
        📜 Récents <span id="historyCount">(0)</span>
      </button>

      <button id="exportBtn" class="btn-action" title="Exporter JSON">📤 Exporter</button>
      <button id="importBtn" class="btn-action" title="Importer JSON">📥 Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">

      <button id="resetBtn" class="btn-action btn-reset" title="Nettoyer non-favoris">🧹 Nettoyer</button>
    </div>
  </header>

  <div id="historyMenu" class="dropdown-menu">
    <div class="dropdown-header">
      <span>Pseudos récents</span>
      <button id="unhideAllBtn" class="dropdown-header-action">Tout démasquer</button>
    </div>
    <div id="historyList"></div>
    <button id="clearHistoryBtn" class="btn-clear-history">Vider l'historique complet</button>
  </div>

  <div id="tagModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="tagModalTitle">Ajouter une étiquette</div>
      <input type="text" id="modalTagInput" class="modal-input" placeholder="Saisir ou choisir un tag..." list="existingTagsDatalist">
      <datalist id="existingTagsDatalist"></datalist>
      <div class="modal-actions">
        <button class="btn-action" id="cancelTagBtn">Annuler</button>
        <button class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7;" id="saveTagBtn">Valider</button>
      </div>
    </div>
  </div>

  <main class="grid-container" id="grid"></main>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let hiddenModels = JSON.parse(localStorage.getItem('cb_dashboard_hidden')) || [];
    let history = JSON.parse(localStorage.getItem('cb_dashboard_history')) || [];
    let tags = JSON.parse(localStorage.getItem('cb_dashboard_tags')) || {};
    
    let showOnlyFavorites = false;
    let showHiddenModels = false;
    let alphabeticalSort = false;
    let currentLayout = parseInt(localStorage.getItem('cb_dashboard_layout_mode')) || 0; 
    let selectedTagFilter = '';
    let searchQuery = '';
    let targetTagUser = null;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const favFilterBtn = document.getElementById('favFilterBtn');
    const hideToggleBtn = document.getElementById('hideToggleBtn');
    const sortToggleBtn = document.getElementById('sortToggleBtn');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    
    const hiddenCount = document.getElementById('hiddenCount');
    const tagFilterSelect = document.getElementById('tagFilterSelect');
    const historyBtn = document.getElementById('historyBtn');
    const historyMenu = document.getElementById('historyMenu');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const unhideAllBtn = document.getElementById('unhideAllBtn');

    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    const tagModal = document.getElementById('tagModal');
    const modalTagInput = document.getElementById('modalTagInput');
    const tagModalTitle = document.getElementById('tagModalTitle');
    const existingTagsDatalist = document.getElementById('existingTagsDatalist');
    const saveTagBtn = document.getElementById('saveTagBtn');
    const cancelTagBtn = document.getElementById('cancelTagBtn');

    function getEmbedUrl(username) {
      return `https://chaturbate.com/embed/${encodeURIComponent(username)}/?embed_video_only=1&scrolling=no&muted=1`;
    }

    function applyLayout() {
      grid.classList.remove('miniature-mode');
      layoutToggleBtn.classList.remove('active');

      if (currentLayout === 1) {
        grid.classList.add('miniature-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '📐 Mode Miniature';
      } else {
        layoutToggleBtn.textContent = '📐 Mode Standard';
      }
      localStorage.setItem('cb_dashboard_layout_mode', currentLayout);
      renderGrid();
    }

    const streamObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;

        const targetSrc = iframe.dataset.src;
        if (entry.isIntersecting) {
          if (iframe.src !== targetSrc) iframe.src = targetSrc;
        } else {
          if (iframe.src && iframe.src !== 'about:blank') iframe.src = 'about:blank';
        }
      });
    }, { root: null, rootMargin: '100px', threshold: 0.05 });

    function saveModels() { localStorage.setItem('cb_dashboard_models', JSON.stringify(models)); }
    function saveFavorites() { localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites)); }
    function saveHidden() { 
      localStorage.setItem('cb_dashboard_hidden', JSON.stringify(hiddenModels)); 
      updateHiddenCount();
    }
    function saveHistory() { 
      localStorage.setItem('cb_dashboard_history', JSON.stringify(history)); 
      updateHistoryMenu();
    }
    function saveTags() { localStorage.setItem('cb_dashboard_tags', JSON.stringify(tags)); }

    function getAllExistingTags() {
      const set = new Set();
      Object.values(tags).forEach(list => list.forEach(t => set.add(t)));
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.push(username);
        saveModels();
      }
      history = [username, ...history.filter(h => h.toLowerCase() !== lower)];
      saveHistory();
      searchQuery = '';
      newModelInput.value = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
    }

    function toggleFavorite(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    }

    function toggleHideModel(username) {
      const lower = username.toLowerCase();
      if (hiddenModels.includes(lower)) {
        hiddenModels = hiddenModels.filter(h => h !== lower);
      } else {
        hiddenModels.push(lower);
      }
      saveHidden();
      renderGrid();
    }

    window.openTagModal = function(username) {
      targetTagUser = username;
      tagModalTitle.textContent = `Ajouter un tag pour ${username}`;
      modalTagInput.value = '';
      
      existingTagsDatalist.innerHTML = '';
      getAllExistingTags().forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        existingTagsDatalist.appendChild(opt);
      });

      tagModal.classList.add('show');
      setTimeout(() => modalTagInput.focus(), 50);
    };

    function closeTagModal() {
      tagModal.classList.remove('show');
      targetTagUser = null;
    }

    function submitTagModal() {
      if (!targetTagUser) return;
      const val = modalTagInput.value.trim();
      if (val) {
        const lower = targetTagUser.toLowerCase();
        const current = tags[lower] || [];
        if (!current.includes(val)) {
          tags[lower] = [...current, val];
          saveTags();
          renderGrid();
        }
      }
      closeTagModal();
    }

    saveTagBtn.addEventListener('click', submitTagModal);
    cancelTagBtn.addEventListener('click', closeTagModal);
    modalTagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTagModal();
      if (e.key === 'Escape') closeTagModal();
    });

    window.removeTag = function(username, tagToRemove) {
      const lower = username.toLowerCase();
      if (tags[lower]) {
        tags[lower] = tags[lower].filter(t => t !== tagToRemove);
        if (tags[lower].length === 0) delete tags[lower];
        saveTags();
        renderGrid();
      }
    };

    function updateTagFilterOptions() {
      const existingTags = getAllExistingTags();
      tagFilterSelect.innerHTML = `<option value="">🏷️ (Tous) (${models.length})</option>`;
      
      existingTags.forEach(t => {
        const count = models.filter(m => (tags[m.toLowerCase()] || []).includes(t)).length;
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `🏷️ ${t} (${count})`;
        if (t === selectedTagFilter) opt.selected = true;
        tagFilterSelect.appendChild(opt);
      });
    }

    function updateHiddenCount() {
      const count = models.filter(m => hiddenModels.includes(m.toLowerCase())).length;
      hiddenCount.textContent = `(${count})`;
    }

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);
      const isHidden = hiddenModels.includes(lower);
      const modelTags = (tags[lower] || []).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      const card = document.createElement('div');
      card.id = `card-${username}`;
      card.className = `model-card ${isHidden ? 'is-hidden' : ''}`;

      const tagsHtml = modelTags.map(t => 
        `<span class="tag-badge" onclick="event.stopPropagation(); removeTag('${username}', '${t}')">${t} &times;</span>`
      ).join('');

      const embedUrl = getEmbedUrl(username);

      card.innerHTML = `
        <div class="model-header">
          <div class="model-title-area">
            <span class="model-name">${username}</span>
            <div class="tags-container">${tagsHtml}</div>
          </div>
          <div class="header-actions">
            <button class="btn-icon-subtle" onclick="event.stopPropagation(); toggleHideModel('${username}')">${isHidden ? '👁️' : '🙈'}</button>
            <button class="btn-icon-subtle" onclick="event.stopPropagation(); openTagModal('${username}')">🏷️</button>
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" onclick="event.stopPropagation(); toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" onclick="event.stopPropagation(); removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation" scrolling="no" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      `;

      streamObserver.observe(card.querySelector('.player-container'));
      return card;
    }

    function renderGrid() {
      streamObserver.disconnect();
      grid.innerHTML = '';
      updateTagFilterOptions();
      updateHiddenCount();
      
      let displayModels = [...models];

      if (searchQuery) {
        displayModels = displayModels.filter(m => m.toLowerCase().includes(searchQuery.toLowerCase()));
      }

      if (alphabeticalSort) {
        displayModels.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
      }

      if (!showHiddenModels) displayModels = displayModels.filter(m => !hiddenModels.includes(m.toLowerCase()));
      if (showOnlyFavorites) displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) displayModels = displayModels.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">Aucun modèle à afficher pour le moment.</div>`;
        updateHistoryMenu();
        return;
      }

      displayModels.forEach(username => grid.appendChild(createCard(username)));
      updateHistoryMenu();
    }

    function updateHistoryMenu() {
      historyCount.textContent = `(${history.length})`;
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<div style="padding: 12px; font-size: 0.8rem; color: #64748b; text-align: center;">Historique vide</div>';
        return;
      }
      [...history].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })).forEach(username => {
        const isPresent = models.map(m => m.toLowerCase()).includes(username.toLowerCase());
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
          <span class="history-username">${username}</span>
          <div class="history-actions">
            ${isPresent ? '<span class="badge-added">Actif</span>' : ''}
            <button class="btn-remove-hist">&times;</button>
          </div>
        `;
        if (!isPresent) item.querySelector('.history-username').addEventListener('click', () => addModelToState(username));
        item.querySelector('.btn-remove-hist').addEventListener('click', (e) => {
          e.stopPropagation();
          history = history.filter(h => h.toLowerCase() !== username.toLowerCase());
          saveHistory();
        });
        historyList.appendChild(item);
      });
    }

    function positionHistoryMenu() {
      const btnRect = historyBtn.getBoundingClientRect();
      let left = btnRect.right - 260;
      if (left < 10) left = 10;
      historyMenu.style.top = `${btnRect.bottom + 8}px`;
      historyMenu.style.left = `${left}px`;
    }

    historyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = historyMenu.classList.contains('show');
      if (!isVisible) { historyMenu.classList.add('show'); positionHistoryMenu(); }
      else historyMenu.classList.remove('show');
    });

    document.addEventListener('click', () => historyMenu.classList.contains('show') && historyMenu.classList.remove('show'));
    historyMenu.addEventListener('click', (e) => e.stopPropagation());

    newModelInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
      renderGrid();
    });

    clearSearchBtn.addEventListener('click', () => {
      newModelInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
      newModelInput.focus();
    });

    hideToggleBtn.addEventListener('click', () => {
      showHiddenModels = !showHiddenModels;
      hideToggleBtn.classList.toggle('active', showHiddenModels);
      renderGrid();
    });

    sortToggleBtn.addEventListener('click', () => {
      alphabeticalSort = !alphabeticalSort;
      sortToggleBtn.classList.toggle('active', alphabeticalSort);
      sortToggleBtn.textContent = alphabeticalSort ? '🔤 Tri A-Z (Actif)' : '🔤 Tri A-Z';
      renderGrid();
    });

    layoutToggleBtn.addEventListener('click', () => {
      currentLayout = currentLayout === 0 ? 1 : 0;
      applyLayout();
    });

    exportBtn.addEventListener('click', () => {
      const backupData = { models, favorites, hiddenModels, history, tags };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `directs-live-backup-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.models && Array.isArray(imported.models)) {
            models = imported.models;
            favorites = Array.isArray(imported.favorites) ? imported.favorites : [];
            hiddenModels = Array.isArray(imported.hiddenModels) ? imported.hiddenModels : [];
            history = Array.isArray(imported.history) ? imported.history : [];
            tags = (imported.tags && typeof imported.tags === 'object') ? imported.tags : {};

            saveModels(); saveFavorites(); saveHidden(); saveHistory(); saveTags();
            renderGrid();
            alert('Configuration importée avec succès !');
          }
        } catch (err) { alert('Erreur lors de la lecture du fichier.'); }
        importFile.value = '';
      };
      reader.readAsText(file);
    });

    unhideAllBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hiddenModels = [];
      saveHidden();
      renderGrid();
    });

    tagFilterSelect.addEventListener('change', (e) => {
      selectedTagFilter = e.target.value;
      renderGrid();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();
      if (username) addModelToState(username);
    });

    function removeModel(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      saveModels();
      renderGrid();
    }

    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      renderGrid();
    });

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;
      if (nonFavsCount === 0) { alert('Aucun modèle non-favori à supprimer.'); return; }
      if (confirm('Voulez-vous supprimer tous les modèles non-favoris ?')) {
        models = models.filter(m => favorites.includes(m.toLowerCase()));
        saveModels();
        renderGrid();
      }
    });

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Voulez-vous effacer l\'historique complet ?')) {
        history = [];
        saveHistory();
      }
    });

    applyLayout();
  </script>
</body>
</html>
