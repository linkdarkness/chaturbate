<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.4rem; }

    /* Style de la barre de recherche */
    .search-container {
      position: relative;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease;
    }

    /* Classe utilitaire pour masquer les cartes filtrées */
    .model-card.hidden {
      display: none !important;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .offline-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #ef4444;
      font-weight: bold;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    .drag-preventer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    .offline-placeholder {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .search-container {
        width: 100%;
      }
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="search-container">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Rechercher un modèle..."
        autocomplete="off"
      >
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');

    // 1. Génération de la grille avec attribut data-username
    models.forEach(username => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('data-username', username.toLowerCase());

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <span class="status-container" id="status-${username}">
            <span class="offline-status" style="color:#94a3b8"><span class="offline-dot" style="background-color:#94a3b8"></span> VÉRIFICATION...</span>
          </span>
        </div>
        <div class="player-container" id="player-${username}">
          <span class="offline-placeholder">Chargement...</span>
        </div>
      `;
      grid.appendChild(card);
    });

    // 2. Filtrage dynamique au fur et à mesure de la saisie
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const cards = grid.querySelectorAll('.model-card');

      cards.forEach(card => {
        const username = card.getAttribute('data-username');
        if (username.includes(query)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    });

    // 3. Connexion au serveur Node.js local
    async function updateModelsStatus() {
      try {
        const response = await fetch(`http://localhost:3000/api/check-status?models=${models.join(',')}`);
        const statuses = await response.json();

        models.forEach(username => {
          const isOnline = statuses[username.toLowerCase()];
          const statusEl = document.getElementById(`status-${username}`);
          const playerEl = document.getElementById(`player-${username}`);

          if (isOnline) {
            statusEl.innerHTML = `<span class="live-status"><span class="live-dot"></span> EN DIRECT</span>`;
            playerEl.innerHTML = `
              <iframe 
                src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
                allow="autoplay; fullscreen" 
                sandbox="allow-scripts allow-same-origin allow-forms"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
              </iframe>
              <div class="drag-preventer"></div>
            `;
          } else {
            statusEl.innerHTML = `<span class="offline-status"><span class="offline-dot"></span> HORS LIGNE</span>`;
            playerEl.innerHTML = `<span class="offline-placeholder">Modèle actuellement hors ligne</span>`;
          }
        });
      } catch (err) {
        console.error('Erreur de connexion au serveur Node :', err);
      }
    }

    updateModelsStatus();
    setInterval(updateModelsStatus, 120000);

    window.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
</body>
</html>
