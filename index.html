<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.2rem; white-space: nowrap; }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-form {
      display: flex;
      gap: 4px;
    }

    .custom-input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-action:hover {
      color: var(--text);
      background: #334155;
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      font-weight: 600;
    }

    .btn-add:hover {
      background: #0369a1;
    }

    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Bouton de filtre favoris */
    .btn-fav-filter.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--star);
      color: var(--star);
      font-weight: 600;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Bouton Étoile Favori */
    .btn-fav {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .btn-fav:hover {
      color: var(--star);
    }

    .btn-fav.is-favorite {
      color: var(--star);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-group">
      <!-- Formulaire pour rajouter des modèles -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo du modèle..." 
          required
        >
        <button type="submit" class="btn-action btn-add">+ Ajouter</button>
      </form>

      <!-- Bouton Filtre Favoris -->
      <button id="favFilterBtn" class="btn-action btn-fav-filter" title="Afficher uniquement les favoris">&#9733; Favoris</button>

      <!-- Bouton Réinitialiser -->
      <button id="resetBtn" class="btn-action btn-reset" title="Réinitialiser la liste par défaut">&#8634; Réinitialiser</button>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const defaultModels = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach'
    ];

    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [...defaultModels];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let showOnlyFavorites = false;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const resetBtn = document.getElementById('resetBtn');
    const favFilterBtn = document.getElementById('favFilterBtn');

    function saveModels() { localStorage.setItem('cb_dashboard_models', JSON.stringify(models)); }
    function saveFavorites() { localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites)); }

    // Activer / Désactiver un favori
    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    };

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);

      const card = document.createElement('div');
      card.className = 'model-card';

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <div class="header-actions">
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Mettre en favori" onclick="toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
          </iframe>
        </div>
      `;
      return card;
    }

    function renderGrid() {
      grid.innerHTML = '';
      
      // Tri : les favoris apparaissent toujours en premier
      let displayModels = [...models].sort((a, b) => {
        const aFav = favorites.includes(a.toLowerCase());
        const bFav = favorites.includes(b.toLowerCase());
        return bFav - aFav;
      });

      // Filtrer si le bouton "Favoris" du header est actif
      if (showOnlyFavorites) {
        displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      }

      displayModels.forEach(username => {
        grid.appendChild(createCard(username));
      });
    }

    // Gestion de l'ajout de modèle
    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username && !models.map(m => m.toLowerCase()).includes(username.toLowerCase())) {
        models.unshift(username);
        saveModels();
        renderGrid();
        newModelInput.value = '';
      }
    });

    // Gestion de la suppression de modèle
    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      favorites = favorites.filter(f => f !== lower);
      saveModels();
      saveFavorites();
      renderGrid();
    };

    // Filtre des favoris dans le header
    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      renderGrid();
    });

    // Gestion de la réinitialisation
    resetBtn.addEventListener('click', () => {
      if (confirm('Voulez-vous réinitialiser la liste et les favoris ?')) {
        models = [...defaultModels];
        favorites = [];
        showOnlyFavorites = false;
        favFilterBtn.classList.remove('active');
        localStorage.removeItem('cb_dashboard_models');
        localStorage.removeItem('cb_dashboard_favs');
        renderGrid();
      }
    });

    renderGrid();
  </script>
</body>
</html>
