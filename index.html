<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --star: #fbbf24;
      --text: #f8fafc;
      --danger: #ef4444;
      --grid-cols: repeat(auto-fill, minmax(360px, 1fr));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.4rem; }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-form {
      display: flex;
      gap: 6px;
    }

    .custom-input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-add:hover {
      background: #0369a1;
    }

    .btn-reset, .btn-fav-filter {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-fav-filter.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--star);
      color: var(--star);
      font-weight: 600;
    }

    .layout-selector {
      display: flex;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .layout-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layout-btn:hover {
      color: var(--text);
    }

    .layout-btn.active {
      background: #334155;
      color: var(--accent);
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: var(--grid-cols);
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease;
    }

    .model-card.hidden {
      display: none !important;
    }

    .model-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bouton Étoile Favori */
    .btn-fav {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .btn-fav.is-favorite {
      color: var(--star);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: #1e293b;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    .drag-preventer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .layout-selector {
        display: none;
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-group {
        flex-direction: column;
        align-items: stretch;
      }
      .input-form {
        width: 100%;
      }
      .custom-input {
        flex: 1;
      }
      .grid-container {
        grid-template-columns: 1fr !important;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-group">
      <!-- Formulaire d'ajout -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo du modèle..." 
          required
          autocomplete="off"
        >
        <button type="submit" class="btn-add">+ Ajouter</button>
      </form>

      <!-- Bouton de réinitialisation -->
      <button id="resetBtn" class="btn-reset" title="Réinitialiser la liste d'origine">&#8634;</button>

      <!-- Bouton Filtre Favoris -->
      <button id="favFilterBtn" class="btn-fav-filter" title="Afficher uniquement les favoris">&#9733; Favoris</button>

      <!-- Barre de recherche -->
      <input 
        type="text" 
        id="searchInput" 
        class="custom-input" 
        placeholder="Filtrer..."
        autocomplete="off"
      >

      <!-- Boutons de disposition -->
      <div class="layout-selector">
        <button class="layout-btn active" data-cols="auto">Auto</button>
        <button class="layout-btn" data-cols="1">1</button>
        <button class="layout-btn" data-cols="2">2</button>
        <button class="layout-btn" data-cols="3">3</button>
        <button class="layout-btn" data-cols="4">4</button>
      </div>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const defaultModels = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [...defaultModels];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let showOnlyFavorites = false;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const resetBtn = document.getElementById('resetBtn');
    const favFilterBtn = document.getElementById('favFilterBtn');
    const searchInput = document.getElementById('searchInput');
    const layoutBtns = document.querySelectorAll('.layout-btn');

    function saveModels() {
      localStorage.setItem('cb_dashboard_models', JSON.stringify(models));
    }

    function saveFavorites() {
      localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites));
    }

    // Basculer l'état favori d'un modèle
    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    };

    // Création d'une carte sans le statut "EN DIRECT"
    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);

      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('data-username', lower);
      card.setAttribute('data-fav', isFav ? 'true' : 'false');

      card.innerHTML = `
        <div class="model-header">
          <div class="header-left">
            <span class="model-name">${username}</span>
          </div>
          <div class="header-actions">
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Favori" onclick="toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
          </iframe>
          <div class="drag-preventer"></div>
        </div>
      `;
      return card;
    }

    // Rendu de la grille (triée : favoris d'abord)
    function renderGrid() {
      grid.innerHTML = '';
      
      const sortedModels = [...models].sort((a, b) => {
        const aFav = favorites.includes(a.toLowerCase());
        const bFav = favorites.includes(b.toLowerCase());
        return bFav - aFav;
      });

      sortedModels.forEach(username => {
        grid.appendChild(createCard(username));
      });

      applyFilters();
    }

    // Ajout d'un modèle
    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username && !models.map(m => m.toLowerCase()).includes(username.toLowerCase())) {
        models.unshift(username);
        saveModels();
        renderGrid();
        newModelInput.value = '';
      }
    });

    // Suppression d'un modèle
    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      favorites = favorites.filter(f => f !== lower);
      saveModels();
      saveFavorites();
      renderGrid();
    };

    // Réinitialisation
    resetBtn.addEventListener('click', () => {
      if (confirm('Réinitialiser la liste avec les modèles par défaut ?')) {
        models = [...defaultModels];
        favorites = [];
        localStorage.removeItem('cb_dashboard_models');
        localStorage.removeItem('cb_dashboard_favs');
        renderGrid();
      }
    });

    // Bouton filtre favoris
    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      applyFilters();
    });

    // Filtres combinés (Recherche texte + Filtre favoris)
    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const cards = grid.querySelectorAll('.model-card');

      cards.forEach(card => {
        const username = card.getAttribute('data-username');
        const isFav = card.getAttribute('data-fav') === 'true';

        const matchesSearch = username.includes(query);
        const matchesFav = !showOnlyFavorites || isFav;

        if (matchesSearch && matchesFav) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    searchInput.addEventListener('input', applyFilters);

    // Disposition des colonnes
    layoutBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        layoutBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const cols = btn.getAttribute('data-cols');
        if (cols === 'auto') {
          grid.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(360px, 1fr))');
        } else {
          grid.style.setProperty('--grid-cols', `repeat(${cols}, 1fr)`);
        }
      });
    });

    window.addEventListener('dragstart', (e) => e.preventDefault());

    renderGrid();
  </script>
</body>
</html>
