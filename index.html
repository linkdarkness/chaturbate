<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --grid-cols: repeat(auto-fill, minmax(360px, 1fr));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.4rem; }

    /* Zone des contrôles */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Barre de recherche */
    .search-container {
      position: relative;
      min-width: 200px;
    }

    .search-input {
      width: 100%;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Boutons de disposition */
    .layout-selector {
      display: flex;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .layout-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layout-btn:hover {
      color: var(--text);
    }

    .layout-btn.active {
      background: #334155;
      color: var(--accent);
    }
    
    /* Grille dynamique */
    .grid-container {
      display: grid;
      grid-template-columns: var(--grid-cols);
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease;
    }

    /* Masquage des cartes filtrées */
    .model-card.hidden {
      display: none !important;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    /* Player fixe et rogné */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    /* Anti drag-and-drop */
    .drag-preventer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .layout-selector {
        display: none; /* Masqué sur petits écrans où 1 seule colonne s'impose */
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-group {
        width: 100%;
      }
      .search-container {
        width: 100%;
      }
      .grid-container {
        grid-template-columns: 1fr !important;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-group">
      <div class="layout-selector">
        <button class="layout-btn active" data-cols="auto">Auto</button>
        <button class="layout-btn" data-cols="1">1 Col</button>
        <button class="layout-btn" data-cols="2">2 Col</button>
        <button class="layout-btn" data-cols="3">3 Col</button>
        <button class="layout-btn" data-cols="4">4 Col</button>
      </div>
      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Rechercher un modèle..."
          autocomplete="off"
        >
      </div>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const layoutBtns = document.querySelectorAll('.layout-btn');

    // Génération instantanée des cartes HTML
    models.forEach(username => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('data-username', username.toLowerCase());

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <span class="live-status"><span class="live-dot"></span> EN DIRECT</span>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
          </iframe>
          <div class="drag-preventer"></div>
        </div>
      `;
      grid.appendChild(card);
    });

    // Gestion du changement de disposition (nombre de colonnes)
    layoutBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        layoutBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const cols = btn.getAttribute('data-cols');
        if (cols === 'auto') {
          grid.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(360px, 1fr))');
        } else {
          grid.style.setProperty('--grid-cols', `repeat(${cols}, 1fr)`);
        }
      });
    });

    // Filtrage dynamique lors de la saisie
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const cards = grid.querySelectorAll('.model-card');

      cards.forEach(card => {
        const username = card.getAttribute('data-username');
        if (username.includes(query)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    });

    // Sécurité glisser-déposer
    window.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
</body>
</html>
