<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard Sécurisé</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      width: 15%;
      flex-shrink: 0;
      height: 38px;
      text-overflow: ellipsis;
    }
    .select-tag:hover, .select-tag:focus { border-color: var(--accent); }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 85%;
      position: relative;
    }

    .custom-input {
      padding: 8px 32px 8px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      height: 38px;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus { border-color: var(--accent); }

    .clear-search-btn {
      position: absolute;
      right: 50px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 6px;
      line-height: 1;
    }
    .clear-search-btn:hover { color: var(--text); }
    .clear-search-btn.show { display: block; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      height: 38px;
    }
    .btn-add:hover { background: #0369a1; border-color: #0369a1; }

    .header-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
      height: 36px;
    }
    .btn-action:hover { color: var(--text); background: #334155; }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-sort.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .btn-layout.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }
    .btn-fav-toggle.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* Grilles standard et miniature */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
      align-content: start;
    }
    
    .grid-container.miniature-mode { 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 8px; 
      padding: 8px; 
    }
    .grid-container.miniature-mode .model-header { padding: 4px 8px; }
    .grid-container.miniature-mode .model-name { font-size: 0.8rem; }
    .grid-container.miniature-mode .tags-container { display: none; }
    .grid-container.miniature-mode .player-container { 
      aspect-ratio: 4 / 3; 
    }

    .empty-message { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748b; font-size: 1rem; }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
      height: fit-content;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .model-title-area { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }

    .model-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .tags-container { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-badge {
      font-size: 0.7rem; background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-badge:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .btn-icon-subtle { background: transparent; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 2px 4px; }
    .btn-icon-subtle:hover { color: var(--text); }
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .btn-fav:hover, .btn-fav.is-favorite { color: var(--star); }
    .btn-delete { background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 2px 4px; }
    .btn-delete:hover { color: var(--danger); }

    .player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; display: block; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .modal-input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; }
    
    .existing-tags-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .suggestion-tag-btn {
      background: #334155;
      color: var(--accent);
      border: 1px solid #475569;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .suggestion-tag-btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ (Tous)</option>
      </select>

      <form id="addModelForm" class="input-form">
        <input type="text" id="newModelInput" class="custom-input" placeholder="Ajouter un pseudo..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Effacer la recherche">&times;</button>
        <button type="submit" class="btn-add" title="Ajouter ce modèle">+</button>
      </form>
    </div>

    <div class="header-bottom-row">
      <button id="sortToggleBtn" class="btn-action btn-sort" title="Trier par ordre alphabétique">AZ</button>
      <button id="layoutToggleBtn" class="btn-action btn-layout" title="Changer le mode d'affichage">⚏</button>
      
      <button id="favToggleBtn" class="btn-action btn-fav-toggle active" title="Afficher uniquement les favoris">⭐ <span id="favStatusText">Favoris</span></button>

      <button id="exportBtn" class="btn-action" title="Exporter les données">📤</button>
      <button id="importBtn" class="btn-action" title="Importer des données">📥</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">

      <button id="resetBtn" class="btn-action btn-reset" title="Vider les non-favoris">🧹</button>
    </div>
  </header>

  <div id="tagModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="tagModalTitle">Ajouter une étiquette</div>
      <input type="text" id="modalTagInput" class="modal-input" placeholder="Ou saisir un nouveau tag...">
      <div id="existingTagsSuggestions" class="existing-tags-suggestions"></div>
      <div class="modal-actions">
        <button class="btn-action" id="cancelTagBtn">Annuler</button>
        <button class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7;" id="saveTagBtn">Valider</button>
      </div>
    </div>
  </div>

  <main class="grid-container" id="grid"></main>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let tags = JSON.parse(localStorage.getItem('cb_dashboard_tags')) || {};
    
    let showOnlyFavorites = true;
    let alphabeticalSort = false;
    let currentLayout = parseInt(localStorage.getItem('cb_dashboard_layout_mode')) || 0; 
    let selectedTagFilter = '';
    let searchQuery = '';
    let targetTagUser = null;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const sortToggleBtn = document.getElementById('sortToggleBtn');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    
    const favToggleBtn = document.getElementById('favToggleBtn');
    const favStatusText = document.getElementById('favStatusText');

    const tagFilterSelect = document.getElementById('tagFilterSelect');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    const tagModal = document.getElementById('tagModal');
    const modalTagInput = document.getElementById('modalTagInput');
    const tagModalTitle = document.getElementById('tagModalTitle');
    const existingTagsSuggestions = document.getElementById('existingTagsSuggestions');
    const saveTagBtn = document.getElementById('saveTagBtn');
    const cancelTagBtn = document.getElementById('cancelTagBtn');

    function getEmbedUrl(username) {
      return `https://chaturbate.com/embed/${encodeURIComponent(username)}/?embed_video_only=1&scrolling=no&muted=1`;
    }

    favToggleBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favToggleBtn.classList.toggle('active', showOnlyFavorites);
      favStatusText.textContent = showOnlyFavorites ? 'Favoris' : 'Tous / Hors favs';
      renderGrid();
    });

    function applyLayout() {
      grid.classList.remove('miniature-mode');
      layoutToggleBtn.classList.remove('active');

      if (currentLayout === 1) {
        grid.classList.add('miniature-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '☩';
        layoutToggleBtn.title = 'Mode Miniature (Actif)';
      } else {
        layoutToggleBtn.textContent = '⚏';
        layoutToggleBtn.title = 'Mode Standard (Actif)';
      }
      localStorage.setItem('cb_dashboard_layout_mode', currentLayout);
      renderGrid();
    }

    const streamObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;

        const targetSrc = iframe.dataset.src;
        if (entry.isIntersecting) {
          if (iframe.src !== targetSrc) iframe.src = targetSrc;
        } else {
          if (iframe.src && iframe.src !== 'about:blank') iframe.src = 'about:blank';
        }
      });
    }, { root: null, rootMargin: '100px', threshold: 0.05 });

    function saveModels() { localStorage.setItem('cb_dashboard_models', JSON.stringify(models)); }
    function saveFavorites() { localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites)); }
    function saveTags() { localStorage.setItem('cb_dashboard_tags', JSON.stringify(tags)); }

    function cleanUnusedTags() {
      let changed = false;
      Object.keys(tags).forEach(modelKey => {
        if (!models.map(m => m.toLowerCase()).includes(modelKey)) {
          delete tags[modelKey];
          changed = true;
        }
      });

      if (selectedTagFilter && !getAllExistingTags().includes(selectedTagFilter)) {
        selectedTagFilter = '';
      }
      if (changed) saveTags();
    }

    function getAllExistingTags() {
      cleanUnusedTags();
      const set = new Set();
      Object.values(tags).forEach(list => list.forEach(t => set.add(t)));
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.push(username);
        saveModels();
      }
      if (!favorites.includes(lower)) {
        favorites.push(lower);
        saveFavorites();
      }
      searchQuery = '';
      newModelInput.value = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
    }

    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    }

    window.openTagModal = function(username) {
      targetTagUser = username;
      tagModalTitle.textContent = `Ajouter un tag pour ${username}`;
      modalTagInput.value = '';
      
      existingTagsSuggestions.innerHTML = '';
      const allTags = getAllExistingTags();
      
      if (allTags.length === 0) {
        existingTagsSuggestions.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">Aucun tag existant.</span>';
      } else {
        allTags.forEach(t => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'suggestion-tag-btn';
          btn.textContent = t;
          btn.onclick = () => applyTagToTarget(t);
          existingTagsSuggestions.appendChild(btn);
        });
      }

      tagModal.classList.add('show');
      setTimeout(() => modalTagInput.focus(), 50);
    };

    function closeTagModal() {
      tagModal.classList.remove('show');
      targetTagUser = null;
    }

    function applyTagToTarget(tagName) {
      if (!targetTagUser) return;
      const val = tagName.trim();
      if (val) {
        const lower = targetTagUser.toLowerCase();
        const current = tags[lower] || [];
        if (!current.includes(val)) {
          tags[lower] = [...current, val];
          saveTags();
          renderGrid();
        }
      }
      closeTagModal();
    }

    function submitTagModal() {
      const val = modalTagInput.value.trim();
      if (val) {
        applyTagToTarget(val);
      } else {
        closeTagModal();
      }
    }

    saveTagBtn.addEventListener('click', submitTagModal);
    cancelTagBtn.addEventListener('click', closeTagModal);
    modalTagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTagModal();
      if (e.key === 'Escape') closeTagModal();
    });

    window.removeTag = function(username, tagToRemove) {
      const lower = username.toLowerCase();
      if (tags[lower]) {
        tags[lower] = tags[lower].filter(t => t !== tagToRemove);
        if (tags[lower].length === 0) delete tags[lower];
        cleanUnusedTags();
        saveTags();
        renderGrid();
      }
    };

    function updateTagFilterOptions() {
      const existingTags = getAllExistingTags();
      tagFilterSelect.innerHTML = `<option value="">🏷️ (${models.length})</option>`;
      
      existingTags.forEach(t => {
        const count = models.filter(m => (tags[m.toLowerCase()] || []).includes(t)).length;
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `🏷️ ${t} (${count})`;
        if (t === selectedTagFilter) opt.selected = true;
        tagFilterSelect.appendChild(opt);
      });
    }

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);
      const modelTags = (tags[lower] || []).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      const card = document.createElement('div');
      card.id = `card-${username}`;
      card.className = `model-card`;

      const tagsHtml = modelTags.map(t => 
        `<span class="tag-badge" onclick="event.stopPropagation(); removeTag('${username}', '${t}')">${t} &times;</span>`
      ).join('');

      const embedUrl = getEmbedUrl(username);

      card.innerHTML = `
        <div class="model-header">
          <div class="model-title-area">
            <span class="model-name">${username}</span>
            <div class="tags-container">${tagsHtml}</div>
          </div>
          <div class="header-actions">
            <button class="btn-icon-subtle" title="Ajouter un tag" onclick="event.stopPropagation(); openTagModal('${username}')">🏷️</button>
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Favori" onclick="event.stopPropagation(); toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="event.stopPropagation(); removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation" scrolling="no" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      `;

      streamObserver.observe(card.querySelector('.player-container'));
      return card;
    }

    function renderGrid() {
      streamObserver.disconnect();
      cleanUnusedTags();
      grid.innerHTML = '';
      updateTagFilterOptions();
      
      let displayModels = [...models];

      if (searchQuery) {
        displayModels = displayModels.filter(m => m.toLowerCase().includes(searchQuery.toLowerCase()));
      }

      if (alphabeticalSort) {
        displayModels.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
      }

      if (showOnlyFavorites) displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) displayModels = displayModels.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">Aucun modèle à afficher pour le moment.</div>`;
        return;
      }

      displayModels.forEach(username => grid.appendChild(createCard(username)));
    }

    newModelInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
      renderGrid();
    });

    clearSearchBtn.addEventListener('click', () => {
      newModelInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
      newModelInput.focus();
    });

    sortToggleBtn.addEventListener('click', () => {
      alphabeticalSort = !alphabeticalSort;
      sortToggleBtn.classList.toggle('active', alphabeticalSort);
      sortToggleBtn.title = alphabeticalSort ? 'Tri A-Z (Actif)' : 'Tri par défaut';
      renderGrid();
    });

    layoutToggleBtn.addEventListener('click', () => {
      currentLayout = currentLayout === 0 ? 1 : 0;
      applyLayout();
    });

    exportBtn.addEventListener('click', () => {
      const backupData = { models, favorites, tags };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `directs-live-backup-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.models && Array.isArray(imported.models)) {
            models = imported.models;
            favorites = Array.isArray(imported.favorites) ? imported.favorites : [];
            tags = (imported.tags && typeof imported.tags === 'object') ? imported.tags : {};

            cleanUnusedTags();
            saveModels(); saveFavorites(); saveTags();
            renderGrid();
            alert('Configuration importée avec succès !');
          }
        } catch (err) { alert('Erreur lors de la lecture du fichier.'); }
        importFile.value = '';
      };
      reader.readAsText(file);
    });

    tagFilterSelect.addEventListener('change', (e) => {
      selectedTagFilter = e.target.value;
      renderGrid();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();
      if (username) addModelToState(username);
    });

    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      delete tags[lower];
      cleanUnusedTags();
      saveModels();
      saveTags();
      renderGrid();
    }

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;
      if (nonFavsCount === 0) { alert('Aucun modèle non-favori à supprimer.'); return; }
      if (confirm('Voulez-vous supprimer tous les modèles non-favoris ?')) {
        models = models.filter(m => favorites.includes(m.toLowerCase()));
        cleanUnusedTags();
        saveModels();
        saveTags();
        renderGrid();
      }
    });

    applyLayout();
  </script>
</body>
</html>
