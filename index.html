<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 1.4rem; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    /* Rognage CSS du lecteur pour masquer le chat et les barres */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    // Ajoute ou retire tes modèles directement ici :
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    const grid = document.getElementById('grid');

    // Génération automatique des cartes dans le DOM
    models.forEach(username => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <span class="live-status"><span class="live-dot"></span> EN DIRECT</span>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
          </iframe>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
