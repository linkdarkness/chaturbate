<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      width: auto;
      flex-shrink: 0;
      height: 36px;
    }
    .select-tag:hover, .select-tag:focus { border-color: var(--accent); }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 85%;
      position: relative;
    }

    .custom-input {
      padding: 8px 32px 8px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      height: 38px;
      transition: border-color 0.2s ease;
    }
    .custom-input:focus { border-color: var(--accent); }

    .clear-search-btn {
      position: absolute;
      right: 50px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 6px;
      line-height: 1;
    }
    .clear-search-btn:hover { color: var(--text); }
    .clear-search-btn.show { display: block; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      height: 38px;
    }
    .btn-add:hover { background: #0369a1; border-color: #0369a1; }

    .header-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
      height: 36px;
    }
    .btn-action:hover { color: var(--text); background: #334155; }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-layout.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }
    .btn-nonfav-toggle.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* PLEIN ÉCRAN PLEINEMENT ADAPTÉ AUX RATIOS */
    .player-container:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto !important;
    }
    .player-container:fullscreen iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
      transform: none !important;
    }
    .player-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto !important;
    }
    .player-container:-webkit-full-screen iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
      transform: none !important;
    }

    /* Volet Non-Favoris */
    .sidebar-container {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transition: left 0.3s ease-in-out;
    }
    .sidebar-container.open { left: 0; }
    
    .sidebar-header {
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .sidebar-close-btn { background: transparent; border: none; color: #64748b; font-size: 1.5rem; cursor: pointer; padding: 2px 8px; }
    .sidebar-close-btn:hover { color: var(--danger); }
    
    .sidebar-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Grille principale */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
      align-content: start;
    }
    
    .grid-container.miniature-mode { 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 8px; 
      padding: 8px; 
    }
    .grid-container.miniature-mode .model-header { padding: 4px 8px; }
    .grid-container.miniature-mode .model-name { font-size: 0.8rem; }
    .grid-container.miniature-mode .tags-container { display: none; }
    
    .grid-container.miniature-mode .player-container { 
      aspect-ratio: 1 / 1; 
      width: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-container.miniature-mode .player-container iframe {
      position: absolute;
      width: 100%;
      height: 56.25%; 
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      border: 0;
    }

    /* VUE LISTE COMPACTE */
    .grid-container.list-mode {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .grid-container.list-mode .model-card {
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 6px;
    }
    .grid-container.list-mode .model-header {
      background: transparent;
      border: none;
      padding: 10px 12px;
      cursor: pointer;
    }
    .grid-container.list-mode .model-header:hover {
      background: rgba(56, 189, 248, 0.05);
    }
    .grid-container.list-mode .player-container {
      display: none;
    }
    .grid-container.list-mode .model-card.expanded .player-container {
      display: block;
      border-top: 1px solid #334155;
    }

    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-message { text-align: center; padding: 60px 20px; color: #64748b; font-size: 1rem; width: 100%; }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 100%;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .model-title-area { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
    .model-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .tags-container { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-badge {
      font-size: 0.7rem; background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-badge:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-icon-subtle { background: transparent; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 2px 4px; }
    .btn-icon-subtle:hover { color: var(--text); }
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .btn-fav:hover, .btn-fav.is-favorite { color: var(--star); }
    .btn-delete { background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 2px 4px; }
    .btn-delete:hover { color: var(--danger); }

    .player-container { 
      width: 100%; 
      aspect-ratio: 16 / 9; 
      background: #000; 
      position: relative; 
      overflow: hidden; 
      display: block; 
      flex-shrink: 0;
    }
    .player-container iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0; 
      display: block; 
    }

    /* Modal générique & Albums photos */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .modal-input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; }
    
    .existing-tags-suggestions {
      display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto; padding: 4px 0;
    }
    .suggestion-tag-btn {
      background: #334155; color: var(--accent); border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
    }
    .suggestion-tag-btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Styles spécifiques Album Photos (Gestion par dossier) */
    .album-modal-card {
      width: 95%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .album-body {
      overflow-y: auto;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
    }
    .album-folder-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .album-folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .album-folder-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .album-folder-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-folder-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-folder-action:hover { color: var(--text); background: #334155; }
    .btn-folder-action.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-folder-action.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }
    .album-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #000;
      cursor: pointer;
    }
    .album-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .album-item:hover img { transform: scale(1.05); }
    
    .album-item-checkbox {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      display: none;
      z-index: 2;
    }
    .album-folder-section.select-mode .album-item-checkbox {
      display: block;
    }
    .album-item.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }

    .album-item-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--danger);
      border: none;
      border-radius: 4px;
      width: 22px;
      height: 22px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .album-folder-section.select-mode .album-item-delete { display: none !important; }
    .album-item:hover .album-item-delete { opacity: 1; }
    .album-item-delete:hover { background: var(--danger); color: #fff; }

    .folder-bulk-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .album-folder-section.select-mode .folder-bulk-bar {
      display: flex;
    }

    .lightbox-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 4000; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <button id="nonFavSidebarBtn" class="btn-action btn-nonfav-toggle" title="Modèles hors favoris" style="width: auto; flex-shrink: 0; height: 36px;">📁 <span id="nonFavCount">(0)</span></button>

      <form id="addModelForm" class="input-form" style="width: 85%;">
        <input type="text" id="newModelInput" class="custom-input" placeholder="Ajouter un pseudo..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Effacer la recherche">&times;</button>
        <button type="submit" class="btn-add" title="Ajouter ce modèle">+</button>
      </form>
    </div>

    <div class="header-bottom-row">
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ (Tous)</option>
      </select>

      <button id="layoutToggleBtn" class="btn-action btn-layout" title="Changer le mode d'affichage">⚏</button>
      <button id="exportBtn" class="btn-action" title="Exporter la configuration (JSON)">📥</button>
      <button id="importBtn" class="btn-action" title="Importer une configuration (JSON)">📤</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
      
      <button id="resetBtn" class="btn-action btn-reset" title="Vider les non-favoris">🧹</button>
    </div>
  </header>

  <!-- Volet Non-Favoris -->
  <div id="nonFavSidebar" class="sidebar-container">
    <div class="sidebar-header">
      <span class="sidebar-title">Modèles hors favoris</span>
      <button id="nonFavCloseBtn" class="sidebar-close-btn">&times;</button>
    </div>
    <div class="sidebar-body sidebar-list" id="nonFavListContainer"></div>
  </div>

  <!-- Modal Tags -->
  <div id="tagModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="tagModalTitle">Ajouter une étiquette</div>
      <input type="text" id="modalTagInput" class="modal-input" placeholder="Ou saisir un nouveau tag...">
      <div id="existingTagsSuggestions" class="existing-tags-suggestions"></div>
      <div class="modal-actions">
        <button class="btn-action" id="cancelTagBtn">Annuler</button>
        <button class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7;" id="saveTagBtn">Valider</button>
      </div>
    </div>
  </div>

  <!-- Modal Album Photos -->
  <div id="albumModal" class="modal-overlay">
    <div class="modal-card album-modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="modal-title" id="albumModalTitle">Album Photos</div>
        <button class="sidebar-close-btn" onclick="closeAlbumModal()">&times;</button>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7; flex: 1;" onclick="triggerPhotoCapture()">📸 Importer des photos (Multi-sélection)</button>
        <input type="file" id="photoCaptureInput" accept="image/*" multiple style="display: none;" onchange="handlePhotoCaptureFiles(event)">
      </div>
      <div class="album-body" id="albumBodyContainer"></div>
    </div>
  </div>

  <!-- Visionneuse Lightbox -->
  <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeLightbox()">
    <button class="lightbox-close">&times;</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Zoom photo">
    <div style="margin-top: 12px; display: flex; gap: 10px;">
      <a id="lightboxDownloadBtn" class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7;" download="capture.jpg" onclick="event.stopPropagation()">📥 Télécharger</a>
    </div>
  </div>

  <main class="grid-container" id="grid"></main>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let tags = JSON.parse(localStorage.getItem('cb_dashboard_tags')) || {};
    let albums = JSON.parse(localStorage.getItem('cb_dashboard_albums')) || {}; 
    
    let currentLayout = parseInt(localStorage.getItem('cb_dashboard_layout_mode')) || 0; 
    let selectedTagFilter = '';
    let searchQuery = '';
    let targetTagUser = null;
    let currentAlbumUser = null;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    
    const nonFavSidebarBtn = document.getElementById('nonFavSidebarBtn');
    const nonFavSidebar = document.getElementById('nonFavSidebar');
    const nonFavCloseBtn = document.getElementById('nonFavCloseBtn');
    const nonFavListContainer = document.getElementById('nonFavListContainer');
    const nonFavCount = document.getElementById('nonFavCount');

    const tagFilterSelect = document.getElementById('tagFilterSelect');

    const tagModal = document.getElementById('tagModal');
    const modalTagInput = document.getElementById('modalTagInput');
    const tagModalTitle = document.getElementById('tagModalTitle');
    const existingTagsSuggestions = document.getElementById('existingTagsSuggestions');
    const saveTagBtn = document.getElementById('saveTagBtn');
    const cancelTagBtn = document.getElementById('cancelTagBtn');

    const albumModal = document.getElementById('albumModal');
    const albumModalTitle = document.getElementById('albumModalTitle');
    const albumBodyContainer = document.getElementById('albumBodyContainer');
    const photoCaptureInput = document.getElementById('photoCaptureInput');

    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxDownloadBtn = document.getElementById('lightboxDownloadBtn');

    function getEmbedUrl(username) {
      return `https://chaturbate.com/embed/${encodeURIComponent(username)}/?embed_video_only=1&mute=1&scrolling=no`;
    }

    function saveToLocalStorage() {
      localStorage.setItem('cb_dashboard_models', JSON.stringify(models));
      localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites));
      localStorage.setItem('cb_dashboard_tags', JSON.stringify(tags));
      localStorage.setItem('cb_dashboard_albums', JSON.stringify(albums));
    }

    exportBtn.addEventListener('click', () => {
      const data = { models, favorites, tags, albums, layoutMode: currentLayout };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `directs_live_backup_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importFileInput.click());

    importFileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData && Array.isArray(importedData.models)) {
            models = importedData.models;
            favorites = Array.isArray(importedData.favorites) ? importedData.favorites : [];
            tags = (importedData.tags && typeof importedData.tags === 'object') ? importedData.tags : {};
            albums = (importedData.albums && typeof importedData.albums === 'object') ? importedData.albums : {};
            if (typeof importedData.layoutMode === 'number') currentLayout = importedData.layoutMode;
            saveToLocalStorage();
            applyLayout();
            if (nonFavSidebar.classList.contains('open')) updateNonFavSidebarList();
            alert('Importation réussie avec succès !');
          } else {
            alert('Format de fichier JSON invalide.');
          }
        } catch (err) {
          alert('Erreur lors de la lecture du fichier JSON : ' + err.message);
        }
        importFileInput.value = '';
      };
      reader.readAsText(file);
    });

    nonFavSidebarBtn.addEventListener('click', () => {
      const isOpen = nonFavSidebar.classList.toggle('open');
      nonFavSidebarBtn.classList.toggle('active', isOpen);
      if (isOpen) updateNonFavSidebarList();
      else streamObserver.disconnect();
    });

    nonFavCloseBtn.addEventListener('click', () => {
      nonFavSidebar.classList.remove('open');
      nonFavSidebarBtn.classList.remove('active');
      streamObserver.disconnect();
    });

    function updateNonFavSidebarList() {
      streamObserver.disconnect();
      let nonFavs = models.filter(m => !favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        nonFavs = nonFavs.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      nonFavs.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      nonFavCount.textContent = `(${nonFavs.length})`;
      nonFavListContainer.innerHTML = '';

      if (nonFavs.length === 0) {
        nonFavListContainer.innerHTML = '<div class="empty-message">Aucun modèle hors favoris</div>';
        return;
      }

      nonFavs.forEach(username => {
        const embedUrl = getEmbedUrl(username);
        const item = document.createElement('div');
        item.className = 'model-card';
        item.id = `card-nf-${username}`;
        item.dataset.username = username;
        item.innerHTML = `
          <div class="model-header">
            <div class="model-title-area"><span class="model-name">${username}</span></div>
            <div class="header-actions">
              <button class="btn-icon-subtle" title="Album photos" onclick="event.stopPropagation(); window.openAlbumModal('${username}')">📸</button>
              <button class="btn-icon-subtle" title="Plein écran vidéo" onclick="event.stopPropagation(); toggleFullscreen('player-nf-${username}')">🖥️</button>
              <button class="btn-fav" title="Favori" onclick="toggleFavorite('${username}'); updateNonFavSidebarList();">&#9733;</button>
              <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}'); updateNonFavSidebarList();">&times;</button>
            </div>
          </div>
          <div class="player-container" id="player-nf-${username}">
            <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
          </div>
        `;
        streamObserver.observe(item.querySelector('.player-container'));
        nonFavListContainer.appendChild(item);
      });
    }

    function applyLayout() {
      grid.classList.remove('miniature-mode', 'list-mode');
      layoutToggleBtn.classList.remove('active');

      if (currentLayout === 1) {
        grid.classList.add('miniature-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '☩';
        layoutToggleBtn.title = 'Mode Miniature 1/1 (Actif)';
      } else if (currentLayout === 2) {
        grid.classList.add('list-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '☰';
        layoutToggleBtn.title = 'Mode Liste Compacte (Actif)';
      } else {
        layoutToggleBtn.textContent = '⚏';
        layoutToggleBtn.title = 'Mode Standard 16/9 (Actif)';
      }
      localStorage.setItem('cb_dashboard_layout_mode', currentLayout);
      renderGrid();
    }

    const streamObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;
        const targetSrc = iframe.dataset.src;
        if (entry.isIntersecting) {
          if (iframe.src !== targetSrc) iframe.src = targetSrc;
        } else {
          if (iframe.src && iframe.src !== 'about:blank') iframe.src = 'about:blank';
        }
      });
    }, { root: null, rootMargin: '100px', threshold: 0.05 });

    function cleanUnusedData() {
      let changed = false;
      const modelKeys = models.map(m => m.toLowerCase());
      Object.keys(tags).forEach(modelKey => {
        if (!modelKeys.includes(modelKey)) { delete tags[modelKey]; changed = true; }
      });
      Object.keys(albums).forEach(modelKey => {
        if (!modelKeys.includes(modelKey)) { delete albums[modelKey]; changed = true; }
      });
      if (selectedTagFilter && !getAllExistingTags().includes(selectedTagFilter)) {
        selectedTagFilter = '';
      }
      if (changed) saveToLocalStorage();
    }

    function getAllExistingTags() {
      cleanUnusedData();
      const set = new Set();
      Object.values(tags).forEach(list => list.forEach(t => set.add(t)));
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.push(username);
      }
      if (!favorites.includes(lower)) {
        favorites.push(lower);
      }
      searchQuery = '';
      newModelInput.value = '';
      clearSearchBtn.classList.remove('show');
      saveToLocalStorage();
      renderGrid();
      if (nonFavSidebar.classList.contains('open')) updateNonFavSidebarList();
    }

    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveToLocalStorage();
      renderGrid();
      if (nonFavSidebar.classList.contains('open')) updateNonFavSidebarList();
    }

    window.toggleFullscreen = function(elementId) {
      const elem = document.getElementById(elementId);
      if (!elem) return;
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(`Erreur plein écran: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    };

    // --- Gestion Avancée des Albums Photos & Dossiers (Exposée globalement) ---
    window.openAlbumModal = function(username) {
      currentAlbumUser = username;
      albumModalTitle.textContent = `Album de ${username}`;
      renderAlbumPhotos();
      albumModal.classList.add('show');
    };

    window.closeAlbumModal = function() {
      albumModal.classList.remove('show');
      currentAlbumUser = null;
    };

    window.triggerPhotoCapture = function() {
      photoCaptureInput.click();
    };

    window.handlePhotoCaptureFiles = function(event) {
      const files = event.target.files;
      if (!files || files.length === 0 || !currentAlbumUser) return;
      
      const now = new Date();
      const dateFolderName = String(now.getDate()).padStart(2, '0') + '/' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                             now.getFullYear();

      const lower = currentAlbumUser.toLowerCase();
      if (!albums[lower]) albums[lower] = {};
      if (!albums[lower][dateFolderName]) albums[lower][dateFolderName] = [];

      let loadedCount = 0;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          albums[lower][dateFolderName].unshift(e.target.result);
          loadedCount++;
          if (loadedCount === files.length) {
            saveToLocalStorage();
            renderAlbumPhotos();
            photoCaptureInput.value = '';
          }
        };
        reader.readAsDataURL(file);
      });
    };

    window.deletePhotoFromAlbum = function(dateFolder, index, event) {
      event.stopPropagation();
      if (!currentAlbumUser) return;
      const lower = currentAlbumUser.toLowerCase();
      if (albums[lower] && albums[lower][dateFolder]) {
        albums[lower][dateFolder].splice(index, 1);
        if (albums[lower][dateFolder].length === 0) {
          delete albums[lower][dateFolder];
        }
        if (Object.keys(albums[lower]).length === 0) {
          delete albums[lower];
        }
        saveToLocalStorage();
        renderAlbumPhotos();
      }
    };

    window.deleteAllPhotosInFolder = function(dateFolder) {
      if (!currentAlbumUser) return;
      if (confirm(`Voulez-vous supprimer toutes les photos du dossier ${dateFolder} ?`)) {
        const lower = currentAlbumUser.toLowerCase();
        if (albums[lower]) {
          delete albums[lower][dateFolder];
          if (Object.keys(albums[lower]).length === 0) {
            delete albums[lower];
          }
          saveToLocalStorage();
          renderAlbumPhotos();
        }
      }
    };

    window.toggleFolderSelectMode = function(dateFolder) {
      const safeId = dateFolder.replace(/[/]/g, '-');
      const section = document.getElementById(`folder-sec-${safeId}`);
      if (!section) return;
      const isSelecting = section.classList.toggle('select-mode');
      const btn = section.querySelector('.btn-select-toggle');
      if (btn) {
        btn.classList.toggle('active', isSelecting);
        btn.textContent = isSelecting ? 'Annuler sélection' : 'Sélectionner';
      }
      if (!isSelecting) {
        section.querySelectorAll('.album-item.selected').forEach(el => el.classList.remove('selected'));
        section.querySelectorAll('.album-item-checkbox').forEach(cb => cb.checked = false);
      }
    };

    window.handlePhotoItemClick = function(dateFolder, index, event, itemElem) {
      const safeId = dateFolder.replace(/[/]/g, '-');
      const section = document.getElementById(`folder-sec-${safeId}`);
      if (!section.classList.contains('select-mode')) {
        const img = itemElem.querySelector('img');
        if (img) openLightbox(img.src);
        return;
      }
      event.stopPropagation();
      const cb = itemElem.querySelector('.album-item-checkbox');
      cb.checked = !cb.checked;
      itemElem.classList.toggle('selected', cb.checked);
    };

    window.deleteSelectedPhotosInFolder = function(dateFolder) {
      if (!currentAlbumUser) return;
      const safeId = dateFolder.replace(/[/]/g, '-');
      const section = document.getElementById(`folder-sec-${safeId}`);
      if (!section) return;

      const checkboxes = section.querySelectorAll('.album-item-checkbox');
      const indicesToRemove = [];
      checkboxes.forEach((cb, idx) => {
        if (cb.checked) indicesToRemove.push(idx);
      });

      if (indicesToRemove.length === 0) {
        alert('Aucune photo sélectionnée.');
        return;
      }

      if (confirm(`Supprimer les ${indicesToRemove.length} photos sélectionnées de ce dossier ?`)) {
        const lower = currentAlbumUser.toLowerCase();
        if (albums[lower] && albums[lower][dateFolder]) {
          indicesToRemove.sort((a, b) => b - a).forEach(idx => {
            albums[lower][dateFolder].splice(idx, 1);
          });
          if (albums[lower][dateFolder].length === 0) {
            delete albums[lower][dateFolder];
          }
          if (Object.keys(albums[lower]).length === 0) {
            delete albums[lower];
          }
          saveToLocalStorage();
          renderAlbumPhotos();
        }
      }
    };

    function renderAlbumPhotos() {
      albumBodyContainer.innerHTML = '';
      if (!currentAlbumUser) return;
      const lower = currentAlbumUser.toLowerCase();
      const modelAlbums = albums[lower] || {};
      const dates = Object.keys(modelAlbums).sort((a, b) => {
        const [dayA, monthA, yearA] = a.split('/').map(Number);
        const [dayB, monthB, yearB] = b.split('/').map(Number);
        return new Date(yearB, monthB - 1, dayB) - new Date(yearA, monthA - 1, dayA);
      });

      if (dates.length === 0) {
        albumBodyContainer.innerHTML = '<div class="empty-message" style="padding: 40px;">Aucune photo dans cet album</div>';
        return;
      }

      dates.forEach(dateFolder => {
        const photos = modelAlbums[dateFolder];
        const safeId = dateFolder.replace(/[/]/g, '-');
        const section = document.createElement('div');
        section.className = 'album-folder-section';
        section.id = `folder-sec-${safeId}`;
        
        let gridHtml = '';
        photos.forEach((src, idx) => {
          gridHtml += `
            <div class="album-item" onclick="handlePhotoItemClick('${dateFolder}', ${idx}, event, this)">
              <input type="checkbox" class="album-item-checkbox" onclick="event.stopPropagation()">
              <img src="${src}" alt="Capture">
              <button class="album-item-delete" title="Supprimer la photo" onclick="deletePhotoFromAlbum('${dateFolder}', ${idx}, event)">&times;</button>
            </div>
          `;
        });

        section.innerHTML = `
          <div class="album-folder-header">
            <div class="album-folder-title">📁 ${dateFolder} (${photos.length})</div>
            <div class="album-folder-actions">
              <button class="btn-folder-action btn-select-toggle" onclick="toggleFolderSelectMode('${dateFolder}')">Sélectionner</button>
              <button class="btn-folder-action danger" title="Supprimer tout le dossier" onclick="deleteAllPhotosInFolder('${dateFolder}')">🗑️ Vider</button>
            </div>
          </div>
          <div class="folder-bulk-bar">
            <span style="font-size:0.75rem; color:#94a3b8;">Gestion par sélection :</span>
            <button class="btn-folder-action danger" onclick="deleteSelectedPhotosInFolder('${dateFolder}')">Supprimer la sélection</button>
          </div>
          <div class="album-grid">${gridHtml}</div>
        `;
        albumBodyContainer.appendChild(section);
      });
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxDownloadBtn.href = src;
      lightboxDownloadBtn.setAttribute('download', `capture_${currentAlbumUser}_${Date.now()}.jpg`);
      lightboxOverlay.classList.add('show');
    }

    window.closeLightbox = function() {
      lightboxOverlay.classList.remove('show');
    };

    window.openTagModal = function(username) {
      targetTagUser = username;
      tagModalTitle.textContent = `Ajouter un tag pour ${username}`;
      modalTagInput.value = '';
      existingTagsSuggestions.innerHTML = '';
      const allTags = getAllExistingTags();
      
      if (allTags.length === 0) {
        existingTagsSuggestions.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">Aucun tag existant.</span>';
      } else {
        allTags.forEach(t => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'suggestion-tag-btn';
          btn.textContent = t;
          btn.onclick = () => applyTagToTarget(t);
          existingTagsSuggestions.appendChild(btn);
        });
      }
      tagModal.classList.add('show');
      setTimeout(() => modalTagInput.focus(), 50);
    };

    function closeTagModal() {
      tagModal.classList.remove('show');
      targetTagUser = null;
    }

    function applyTagToTarget(tagName) {
      if (!targetTagUser) return;
      const val = tagName.trim();
      if (val) {
        const lower = targetTagUser.toLowerCase();
        const current = tags[lower] || [];
        if (!current.includes(val)) {
          tags[lower] = [...current, val];
          saveToLocalStorage();
          renderGrid();
        }
      }
      closeTagModal();
    }

    saveTagBtn.addEventListener('click', () => {
      const val = modalTagInput.value.trim();
      if (val) applyTagToTarget(val);
      else closeTagModal();
    });
    cancelTagBtn.addEventListener('click', closeTagModal);

    window.removeTag = function(username, tagToRemove) {
      const lower = username.toLowerCase();
      if (tags[lower]) {
        tags[lower] = tags[lower].filter(t => t !== tagToRemove);
        if (tags[lower].length === 0) delete tags[lower];
        cleanUnusedData();
        saveToLocalStorage();
        renderGrid();
      }
    };

    function updateTagFilterOptions() {
      const existingTags = getAllExistingTags();
      tagFilterSelect.innerHTML = `<option value="">🏷️ (${models.length})</option>`;
      existingTags.forEach(t => {
        const count = models.filter(m => (tags[m.toLowerCase()] || []).includes(t)).length;
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `🏷️ ${t} (${count})`;
        if (t === selectedTagFilter) opt.selected = true;
        tagFilterSelect.appendChild(opt);
      });
    }

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);
      const modelTags = (tags[lower] || []).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      const card = document.createElement('div');
      card.className = `model-card`;
      card.id = `card-${username}`;
      card.dataset.username = username;

      const tagsHtml = modelTags.map(t => 
        `<span class="tag-badge" onclick="event.stopPropagation(); removeTag('${username}', '${t}')">${t} &times;</span>`
      ).join('');

      const embedUrl = getEmbedUrl(username);

      card.innerHTML = `
        <div class="model-header" id="header-${username}">
          <div class="model-title-area">
            <span class="model-name">${username}</span>
            <div class="tags-container">${tagsHtml}</div>
          </div>
          <div class="header-actions">
            <button class="btn-icon-subtle" title="Album photos" onclick="event.stopPropagation(); window.openAlbumModal('${username}')">📸</button>
            <button class="btn-icon-subtle" title="Plein écran vidéo" onclick="event.stopPropagation(); toggleFullscreen('player-${username}')">🖥️️</button>
            <button class="btn-icon-subtle" title="Ajouter un tag" onclick="event.stopPropagation(); openTagModal('${username}')">🏷</button>
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Favori" onclick="event.stopPropagation(); toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="event.stopPropagation(); removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container" id="player-${username}">
          <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
      `;

      const headerElem = card.querySelector(`#header-${username}`);
      const playerContainerElem = card.querySelector('.player-container');

      headerElem.addEventListener('click', () => {
        if (currentLayout === 2) {
          const isExpanded = card.classList.toggle('expanded');
          if (isExpanded) {
            const iframe = playerContainerElem.querySelector('iframe');
            if (iframe && iframe.src !== iframe.dataset.src) {
              iframe.src = iframe.dataset.src;
            }
          }
        }
      });

      if (currentLayout !== 2) {
        streamObserver.observe(playerContainerElem);
      }
      return card;
    }

    function renderGrid() {
      if (!nonFavSidebar.classList.contains('open')) {
        streamObserver.disconnect();
      }
      cleanUnusedData();
      grid.innerHTML = '';
      updateTagFilterOptions();
      
      let nonFavsForCount = models.filter(m => !favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        nonFavsForCount = nonFavsForCount.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      nonFavCount.textContent = `(${nonFavsForCount.length})`;

      if (nonFavSidebar.classList.contains('open')) {
        updateNonFavSidebarList();
        return;
      }
      
      let displayModels = [...models];
      if (searchQuery) {
        displayModels = displayModels.filter(m => m.toLowerCase().includes(searchQuery.toLowerCase()));
      }
      displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        displayModels = displayModels.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      displayModels.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">Aucun modèle favori à afficher pour le moment.</div>`;
        return;
      }
      displayModels.forEach(username => {
        grid.appendChild(createCard(username));
      });
    }

    newModelInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
      renderGrid();
    });

    clearSearchBtn.addEventListener('click', () => {
      newModelInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
      newModelInput.focus();
    });

    layoutToggleBtn.addEventListener('click', () => {
      currentLayout = (currentLayout + 1) % 3;
      applyLayout();
    });

    tagFilterSelect.addEventListener('change', (e) => {
      selectedTagFilter = e.target.value;
      renderGrid();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();
      if (username) addModelToState(username);
    });

    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      delete tags[lower];
      delete albums[lower];
      cleanUnusedData();
      saveToLocalStorage();
      renderGrid();
    }

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;
      if (nonFavsCount === 0) { alert('Aucun modèle non-favori à supprimer.'); return; }
      if (confirm('Voulez-vous supprimer tous les modèles non-favoris ?')) {
        models = models.filter(m => favorites.includes(m.toLowerCase()));
        cleanUnusedData();
        saveToLocalStorage();
        renderGrid();
      }
    });

    applyLayout();
  </script>
</body>
</html>
