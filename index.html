<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      width: auto;
      flex-shrink: 0;
      height: 36px;
    }
    .select-tag:hover, .select-tag:focus { border-color: var(--accent); }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 85%;
      position: relative;
    }

    .custom-input {
      padding: 8px 32px 8px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      height: 38px;
      transition: border-color 0.2s ease;
    }
    .custom-input:focus { border-color: var(--accent); }

    .clear-search-btn {
      position: absolute;
      right: 50px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 6px;
      line-height: 1;
    }
    .clear-search-btn:hover { color: var(--text); }
    .clear-search-btn.show { display: block; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      height: 38px;
    }
    .btn-add:hover { background: #0369a1; border-color: #0369a1; }

    .header-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
      height: 36px;
    }
    .btn-action:hover { color: var(--text); background: #334155; }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-layout.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }
    .btn-nonfav-toggle.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    
    .local-status { font-size: 0.75rem; color: #64748b; margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .local-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }

    /* Volet Non-Favoris */
    .sidebar-container {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transition: left 0.3s ease-in-out;
    }
    .sidebar-container.open { left: 0; }
    
    .sidebar-header {
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .sidebar-close-btn { background: transparent; border: none; color: #64748b; font-size: 1.5rem; cursor: pointer; padding: 2px 8px; }
    .sidebar-close-btn:hover { color: var(--danger); }
    
    .sidebar-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Grille principale */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
      align-content: start;
    }
    
    .grid-container.miniature-mode { 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 8px; 
      padding: 8px; 
    }
    .grid-container.miniature-mode .model-header { padding: 4px 8px; }
    .grid-container.miniature-mode .model-name { font-size: 0.8rem; }
    .grid-container.miniature-mode .tags-container { display: none; }
    
    .grid-container.miniature-mode .player-container { 
      aspect-ratio: 1 / 1; 
      width: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-container.miniature-mode .player-container iframe {
      position: absolute;
      width: 100%;
      height: 56.25%; 
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      border: 0;
    }

    /* VUE LISTE COMPACTE */
    .grid-container.list-mode {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .grid-container.list-mode .model-card {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--card-bg);
      border-radius: 6px;
    }
    .grid-container.list-mode .model-header {
      background: transparent;
      border: none;
      padding: 0;
      flex: 1;
    }
    .grid-container.list-mode .player-container {
      display: none;
    }

    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-message { text-align: center; padding: 60px 20px; color: #64748b; font-size: 1rem; width: 100%; }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 100%;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .model-title-area { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
    .model-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .tags-container { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-badge {
      font-size: 0.7rem; background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-badge:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-icon-subtle { background: transparent; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 2px 4px; }
    .btn-icon-subtle:hover { color: var(--text); }
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .btn-fav:hover, .btn-fav.is-favorite { color: var(--star); }
    .btn-delete { background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 2px 4px; }
    .btn-delete:hover { color: var(--danger); }

    .player-container { 
      width: 100%; 
      aspect-ratio: 16 / 9; 
      background: #000; 
      position: relative; 
      overflow: hidden; 
      display: block; 
      flex-shrink: 0;
    }
    .player-container iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0; 
      display: block; 
    }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .modal-input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; }
    
    .existing-tags-suggestions {
      display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto; padding: 4px 0;
    }
    .suggestion-tag-btn {
      background: #334155; color: var(--accent); border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
    }
    .suggestion-tag-btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <button id="nonFavSidebarBtn" class="btn-action btn-nonfav-toggle" title="Modèles hors favoris" style="width: auto; flex-shrink: 0; height: 36px;">📁 <span id="nonFavCount">(0)</span></button>

      <form id="addModelForm" class="input-form" style="width: 85%;">
        <input type="text" id="newModelInput" class="custom-input" placeholder="Ajouter un pseudo..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Effacer la recherche">&times;</button>
        <button type="submit" class="btn-add" title="Ajouter ce modèle">+</button>
      </form>
    </div>

    <div class="header-bottom-row">
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ (Tous)</option>
      </select>

      <button id="layoutToggleBtn" class="btn-action btn-layout" title="Changer le mode d'affichage">⚏</button>
      <button id="resetBtn" class="btn-action btn-reset" title="Vider les non-favoris">🧹</button>

      <div class="local-status">
        <span class="local-dot"></span>
        <span>Local</span>
      </div>
    </div>
  </header>

  <!-- Volet Non-Favoris -->
  <div id="nonFavSidebar" class="sidebar-container">
    <div class="sidebar-header">
      <span class="sidebar-title">Modèles hors favoris</span>
      <button id="nonFavCloseBtn" class="sidebar-close-btn">&times;</button>
    </div>
    <div class="sidebar-body sidebar-list" id="nonFavListContainer"></div>
  </div>

  <!-- Modal Tags -->
  <div id="tagModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="tagModalTitle">Ajouter une étiquette</div>
      <input type="text" id="modalTagInput" class="modal-input" placeholder="Ou saisir un nouveau tag...">
      <div id="existingTagsSuggestions" class="existing-tags-suggestions"></div>
      <div class="modal-actions">
        <button class="btn-action" id="cancelTagBtn">Annuler</button>
        <button class="btn-action" style="background: #0284c7; color: #fff; border-color: #0284c7;" id="saveTagBtn">Valider</button>
      </div>
    </div>
  </div>

  <main class="grid-container" id="grid"></main>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let tags = JSON.parse(localStorage.getItem('cb_dashboard_tags')) || {};
    
    // 0 = Standard (16/9), 1 = Miniature (1/1), 2 = Liste compacte
    let currentLayout = parseInt(localStorage.getItem('cb_dashboard_layout_mode')) || 0; 
    let selectedTagFilter = '';
    let searchQuery = '';
    let targetTagUser = null;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    
    const nonFavSidebarBtn = document.getElementById('nonFavSidebarBtn');
    const nonFavSidebar = document.getElementById('nonFavSidebar');
    const nonFavCloseBtn = document.getElementById('nonFavCloseBtn');
    const nonFavListContainer = document.getElementById('nonFavListContainer');
    const nonFavCount = document.getElementById('nonFavCount');

    const tagFilterSelect = document.getElementById('tagFilterSelect');

    const tagModal = document.getElementById('tagModal');
    const modalTagInput = document.getElementById('modalTagInput');
    const tagModalTitle = document.getElementById('tagModalTitle');
    const existingTagsSuggestions = document.getElementById('existingTagsSuggestions');
    const saveTagBtn = document.getElementById('saveTagBtn');
    const cancelTagBtn = document.getElementById('cancelTagBtn');

    function getEmbedUrl(username) {
      return `https://chaturbate.com/embed/${encodeURIComponent(username)}/?embed_video_only=1&disable_sound=0&scrolling=no`;
    }

    function saveToLocalStorage() {
      localStorage.setItem('cb_dashboard_models', JSON.stringify(models));
      localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites));
      localStorage.setItem('cb_dashboard_tags', JSON.stringify(tags));
    }

    nonFavSidebarBtn.addEventListener('click', () => {
      const isOpen = nonFavSidebar.classList.toggle('open');
      nonFavSidebarBtn.classList.toggle('active', isOpen);
      if (isOpen) updateNonFavSidebarList();
      else streamObserver.disconnect();
    });

    nonFavCloseBtn.addEventListener('click', () => {
      nonFavSidebar.classList.remove('open');
      nonFavSidebarBtn.classList.remove('active');
      streamObserver.disconnect();
    });

    function updateNonFavSidebarList() {
      streamObserver.disconnect();
      let nonFavs = models.filter(m => !favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        nonFavs = nonFavs.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      nonFavs.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      nonFavCount.textContent = `(${nonFavs.length})`;
      nonFavListContainer.innerHTML = '';

      if (nonFavs.length === 0) {
        nonFavListContainer.innerHTML = '<div class="empty-message">Aucun modèle hors favoris</div>';
        return;
      }

      nonFavs.forEach(username => {
        const embedUrl = getEmbedUrl(username);
        const item = document.createElement('div');
        item.className = 'model-card';
        item.innerHTML = `
          <div class="model-header">
            <div class="model-title-area"><span class="model-name">${username}</span></div>
            <div class="header-actions">
              <button class="btn-fav" title="Favori" onclick="toggleFavorite('${username}'); updateNonFavSidebarList();">&#9733;</button>
              <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}'); updateNonFavSidebarList();">&times;</button>
            </div>
          </div>
          <div class="player-container">
            <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
          </div>
        `;
        streamObserver.observe(item.querySelector('.player-container'));
        nonFavListContainer.appendChild(item);
      });
    }

    function applyLayout() {
      grid.classList.remove('miniature-mode', 'list-mode');
      layoutToggleBtn.classList.remove('active');

      if (currentLayout === 1) {
        grid.classList.add('miniature-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '☩';
        layoutToggleBtn.title = 'Mode Miniature 1/1 (Actif)';
      } else if (currentLayout === 2) {
        grid.classList.add('list-mode');
        layoutToggleBtn.classList.add('active');
        layoutToggleBtn.textContent = '☰';
        layoutToggleBtn.title = 'Mode Liste Compacte (Actif)';
      } else {
        layoutToggleBtn.textContent = '⚏';
        layoutToggleBtn.title = 'Mode Standard 16/9 (Actif)';
      }
      localStorage.setItem('cb_dashboard_layout_mode', currentLayout);
      renderGrid();
    }

    const streamObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const container = entry.target;
        const iframe = container.querySelector('iframe');
        if (!iframe) return;
        const targetSrc = iframe.dataset.src;
        if (entry.isIntersecting) {
          if (iframe.src !== targetSrc) iframe.src = targetSrc;
        } else {
          if (iframe.src && iframe.src !== 'about:blank') iframe.src = 'about:blank';
        }
      });
    }, { root: null, rootMargin: '100px', threshold: 0.05 });

    function cleanUnusedTags() {
      let changed = false;
      Object.keys(tags).forEach(modelKey => {
        if (!models.map(m => m.toLowerCase()).includes(modelKey)) {
          delete tags[modelKey];
          changed = true;
        }
      });
      if (selectedTagFilter && !getAllExistingTags().includes(selectedTagFilter)) {
        selectedTagFilter = '';
      }
      if (changed) saveToLocalStorage();
    }

    function getAllExistingTags() {
      cleanUnusedTags();
      const set = new Set();
      Object.values(tags).forEach(list => list.forEach(t => set.add(t)));
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
    }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.push(username);
      }
      if (!favorites.includes(lower)) {
        favorites.push(lower);
      }
      searchQuery = '';
      newModelInput.value = '';
      clearSearchBtn.classList.remove('show');
      saveToLocalStorage();
      renderGrid();
      if (nonFavSidebar.classList.contains('open')) updateNonFavSidebarList();
    }

    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveToLocalStorage();
      renderGrid();
      if (nonFavSidebar.classList.contains('open')) updateNonFavSidebarList();
    }

    window.openTagModal = function(username) {
      targetTagUser = username;
      tagModalTitle.textContent = `Ajouter un tag pour ${username}`;
      modalTagInput.value = '';
      existingTagsSuggestions.innerHTML = '';
      const allTags = getAllExistingTags();
      
      if (allTags.length === 0) {
        existingTagsSuggestions.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">Aucun tag existant.</span>';
      } else {
        allTags.forEach(t => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'suggestion-tag-btn';
          btn.textContent = t;
          btn.onclick = () => applyTagToTarget(t);
          existingTagsSuggestions.appendChild(btn);
        });
      }
      tagModal.classList.add('show');
      setTimeout(() => modalTagInput.focus(), 50);
    };

    function closeTagModal() {
      tagModal.classList.remove('show');
      targetTagUser = null;
    }

    function applyTagToTarget(tagName) {
      if (!targetTagUser) return;
      const val = tagName.trim();
      if (val) {
        const lower = targetTagUser.toLowerCase();
        const current = tags[lower] || [];
        if (!current.includes(val)) {
          tags[lower] = [...current, val];
          saveToLocalStorage();
          renderGrid();
        }
      }
      closeTagModal();
    }

    saveTagBtn.addEventListener('click', () => {
      const val = modalTagInput.value.trim();
      if (val) applyTagToTarget(val);
      else closeTagModal();
    });
    cancelTagBtn.addEventListener('click', closeTagModal);

    window.removeTag = function(username, tagToRemove) {
      const lower = username.toLowerCase();
      if (tags[lower]) {
        tags[lower] = tags[lower].filter(t => t !== tagToRemove);
        if (tags[lower].length === 0) delete tags[lower];
        cleanUnusedTags();
        saveToLocalStorage();
        renderGrid();
      }
    };

    function updateTagFilterOptions() {
      const existingTags = getAllExistingTags();
      tagFilterSelect.innerHTML = `<option value="">🏷️ (${models.length})</option>`;
      existingTags.forEach(t => {
        const count = models.filter(m => (tags[m.toLowerCase()] || []).includes(t)).length;
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `🏷️ ${t} (${count})`;
        if (t === selectedTagFilter) opt.selected = true;
        tagFilterSelect.appendChild(opt);
      });
    }

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);
      const modelTags = (tags[lower] || []).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      const card = document.createElement('div');
      card.id = `card-${username}`;
      card.className = `model-card`;

      const tagsHtml = modelTags.map(t => 
        `<span class="tag-badge" onclick="event.stopPropagation(); removeTag('${username}', '${t}')">${t} &times;</span>`
      ).join('');

      const embedUrl = getEmbedUrl(username);

      card.innerHTML = `
        <div class="model-header">
          <div class="model-title-area">
            <span class="model-name">${username}</span>
            <div class="tags-container">${tagsHtml}</div>
          </div>
          <div class="header-actions">
            <button class="btn-icon-subtle" title="Ajouter un tag" onclick="event.stopPropagation(); openTagModal('${username}')">🏷️</button>
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Favori" onclick="event.stopPropagation(); toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="event.stopPropagation(); removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe data-src="${embedUrl}" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
      `;
      if (currentLayout !== 2) {
        streamObserver.observe(card.querySelector('.player-container'));
      }
      return card;
    }

    function renderGrid() {
      if (!nonFavSidebar.classList.contains('open')) {
        streamObserver.disconnect();
      }
      cleanUnusedTags();
      grid.innerHTML = '';
      updateTagFilterOptions();
      
      let nonFavsForCount = models.filter(m => !favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        nonFavsForCount = nonFavsForCount.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      nonFavCount.textContent = `(${nonFavsForCount.length})`;

      if (nonFavSidebar.classList.contains('open')) {
        updateNonFavSidebarList();
        return;
      }
      
      let displayModels = [...models];
      if (searchQuery) {
        displayModels = displayModels.filter(m => m.toLowerCase().includes(searchQuery.toLowerCase()));
      }
      displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      if (selectedTagFilter) {
        displayModels = displayModels.filter(m => (tags[m.toLowerCase()] || []).includes(selectedTagFilter));
      }
      displayModels.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">Aucun modèle favori à afficher pour le moment.</div>`;
        return;
      }
      displayModels.forEach(username => grid.appendChild(createCard(username)));
    }

    newModelInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
      renderGrid();
    });

    clearSearchBtn.addEventListener('click', () => {
      newModelInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.remove('show');
      renderGrid();
      newModelInput.focus();
    });

    layoutToggleBtn.addEventListener('click', () => {
      currentLayout = (currentLayout + 1) % 3; // Alterne entre 0 (Standard), 1 (Miniature), et 2 (Liste)
      applyLayout();
    });

    tagFilterSelect.addEventListener('change', (e) => {
      selectedTagFilter = e.target.value;
      renderGrid();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();
      if (username) addModelToState(username);
    });

    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      delete tags[lower];
      cleanUnusedTags();
      saveToLocalStorage();
      renderGrid();
    }

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;
      if (nonFavsCount === 0) { alert('Aucun modèle non-favori à supprimer.'); return; }
      if (confirm('Voulez-vous supprimer tous les modèles non-favoris ?')) {
        models = models.filter(m => favorites.includes(m.toLowerCase()));
        cleanUnusedTags();
        saveToLocalStorage();
        renderGrid();
      }
    });

    // Lancement au démarrage
    applyLayout();
  </script>
</body>
</html>
