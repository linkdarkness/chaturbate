<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .model-btn {
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .model-btn:hover {
      border-color: var(--accent);
      background: #1e293b;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Live</h1>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <!-- L'URL /embed/ est la SEULE acceptée dans un iframe -->
        <iframe 
          src="https://chaturbate.com/embed/dreamsweetgirl/" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Modèles</h2>
      <div class="models-list">
        <!-- Remplace les pseudos par ceux que tu souhaites afficher -->
        <button class="model-btn" onclick="loadModel('dreamsweetgirl')">
          <span>Dreamsweetgirl</span>
          <span class="live-dot"></span>
        </button>
        <button class="model-btn" onclick="loadModel('cutefacebigass')">
          <span>shiny_lily</span>
          <span class="live-dot"></span>
        </button>
<button class="model-btn" onclick="loadModel('shiny_lily')">
          <span>shiny_lily</span>
          <span class="live-dot"></span>
        </button>
      </div>
    </aside>
  </div>

  <script>
    function loadModel(username) {
      const player = document.getElementById('player');
      // Intégration du lecteur vidéo officiel
      player.innerHTML = `
        <iframe 
          src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
