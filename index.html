<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --grid-cols: repeat(auto-fill, minmax(360px, 1fr));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.4rem; }

    /* Zone des contrôles */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Formulaires de saisie */
    .input-form {
      display: flex;
      gap: 6px;
    }

    .custom-input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .custom-input:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-add:hover {
      background: #0369a1;
    }

    /* Boutons de disposition */
    .layout-selector {
      display: flex;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .layout-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .layout-btn:hover {
      color: var(--text);
    }

    .layout-btn.active {
      background: #334155;
      color: var(--accent);
    }
    
    /* Grille dynamique */
    .grid-container {
      display: grid;
      grid-template-columns: var(--grid-cols);
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease;
    }

    .model-card.hidden {
      display: none !important;
    }

    .model-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    /* Bouton de suppression sur la carte */
    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: #1e293b;
    }

    /* Player fixe et rogné */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    /* Anti drag-and-drop */
    .drag-preventer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .layout-selector {
        display: none;
      }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-group {
        flex-direction: column;
        align-items: stretch;
      }
      .input-form {
        width: 100%;
      }
      .custom-input {
        flex: 1;
      }
      .grid-container {
        grid-template-columns: 1fr !important;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-group">
      <!-- Formulaire d'ajout -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo du modèle..." 
          required
          autocomplete="off"
        >
        <button type="submit" class="btn-add">+ Ajouter</button>
      </form>

      <!-- Barre de recherche -->
      <input 
        type="text" 
        id="searchInput" 
        class="custom-input" 
        placeholder="Filtrer..."
        autocomplete="off"
      >

      <!-- Boutons de disposition -->
      <div class="layout-selector">
        <button class="layout-btn active" data-cols="auto">Auto</button>
        <button class="layout-btn" data-cols="1">1</button>
        <button class="layout-btn" data-cols="2">2</button>
        <button class="layout-btn" data-cols="3">3</button>
        <button class="layout-btn" data-cols="4">4</button>
      </div>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    // Liste par défaut si aucun localStorage
    const defaultModels = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    // Chargement de la liste depuis le localStorage
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || defaultModels;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const searchInput = document.getElementById('searchInput');
    const layoutBtns = document.querySelectorAll('.layout-btn');

    // Sauvegarder la liste dans le localStorage
    function saveModels() {
      localStorage.setItem('cb_dashboard_models', JSON.stringify(models));
    }

    // Créer le DOM d'une carte
    function createCard(username) {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('data-username', username.toLowerCase());

      card.innerHTML = `
        <div class="model-header">
          <div class="header-left">
            <span class="model-name">${username}</span>
            <span class="live-status"><span class="live-dot"></span> EN DIRECT</span>
          </div>
          <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}')">&times;</button>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            sandbox="allow-scripts allow-same-origin allow-forms"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
          </iframe>
          <div class="drag-preventer"></div>
        </div>
      `;
      return card;
    }

    // Rendu de toute la grille
    function renderGrid() {
      grid.innerHTML = '';
      models.forEach(username => {
        grid.appendChild(createCard(username));
      });
      applySearchFilter();
    }

    // Ajouter un nouveau modèle
    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username && !models.map(m => m.toLowerCase()).includes(username.toLowerCase())) {
        models.unshift(username); // Ajoute au début de la liste
        saveModels();
        renderGrid();
        newModelInput.value = '';
      }
    });

    // Supprimer un modèle
    window.removeModel = function(username) {
      models = models.filter(m => m.toLowerCase() !== username.toLowerCase());
      saveModels();
      renderGrid();
    };

    // Filtre de recherche dynamique
    function applySearchFilter() {
      const query = searchInput.value.trim().toLowerCase();
      const cards = grid.querySelectorAll('.model-card');

      cards.forEach(card => {
        const username = card.getAttribute('data-username');
        if (username.includes(query)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    searchInput.addEventListener('input', applySearchFilter);

    // Gestion de la disposition (colonnes)
    layoutBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        layoutBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const cols = btn.getAttribute('data-cols');
        if (cols === 'auto') {
          grid.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(360px, 1fr))');
        } else {
          grid.style.setProperty('--grid-cols', `repeat(${cols}, 1fr)`);
        }
      });
    });

    // Sécurité glisser-déposer
    window.addEventListener('dragstart', (e) => e.preventDefault());

    // Chargement initial
    renderGrid();
  </script>
</body>
</html>
