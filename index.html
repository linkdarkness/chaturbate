<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header toujours visible (Sticky) */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 1.1rem; white-space: nowrap; }

    /* Alignement parfait de tous les contrôles sur une ligne */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .custom-input {
      padding: 6px 10px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 130px;
      transition: width 0.2s ease, border-color 0.2s ease;
    }

    .custom-input:focus {
      border-color: var(--accent);
      width: 160px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn-action:hover {
      color: var(--text);
      background: #334155;
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 6px 10px;
    }

    .btn-add:hover {
      background: #0369a1;
      border-color: #0369a1;
    }

    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-fav-filter.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--star);
      color: var(--star);
      font-weight: 600;
    }

    /* Conteneur Dropdown */
    .dropdown {
      position: relative;
    }

    /* Menu déroulant de l'historique */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      width: 260px;
      max-width: 90vw;
      max-height: 320px;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      z-index: 110;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-header {
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      border-bottom: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item {
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      transition: background 0.15s ease;
      gap: 8px;
    }

    .history-item:hover {
      background: #283548;
    }

    .history-username {
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-username:hover {
      color: var(--accent);
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-added {
      font-size: 0.7rem;
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #64748b;
    }

    .btn-remove-hist {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .btn-remove-hist:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .btn-clear-history {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: none;
      border-top: 1px solid #334155;
      color: var(--danger);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-clear-history:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 1rem;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-fav {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .btn-fav:hover, .btn-fav.is-favorite {
      color: var(--star);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    @media (max-width: 500px) {
      header {
        padding: 8px 10px;
      }
      h1 {
        display: none;
      }
      .custom-input {
        width: 100px;
      }
      .custom-input:focus {
        width: 120px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-group">
      <!-- Formulaire avec bouton directement collé -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo..." 
          required
        >
        <button type="submit" class="btn-action btn-add" title="Ajouter ce modèle">+</button>
      </form>

      <!-- Menu Historique -->
      <div class="dropdown">
        <button id="historyBtn" class="btn-action" title="Historique des modèles">
          📜 <span id="historyCount">(0)</span>
        </button>
        <div id="historyMenu" class="dropdown-menu">
          <div class="dropdown-header">Pseudos récents</div>
          <div id="historyList"></div>
          <button id="clearHistoryBtn" class="btn-clear-history">Vider l'historique complet</button>
        </div>
      </div>

      <!-- Bouton Filtre Favoris -->
      <button id="favFilterBtn" class="btn-action btn-fav-filter" title="Afficher uniquement les favoris">&#9733;</button>

      <!-- Bouton Réinitialiser (Ne garde que les favoris) -->
      <button id="resetBtn" class="btn-action btn-reset" title="Supprimer tous les modèles non-favoris">🧹 Nettoyer</button>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let history = JSON.parse(localStorage.getItem('cb_dashboard_history')) || [];
    let showOnlyFavorites = false;

    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const resetBtn = document.getElementById('resetBtn');
    const favFilterBtn = document.getElementById('favFilterBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historyMenu = document.getElementById('historyMenu');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    function saveModels() { localStorage.setItem('cb_dashboard_models', JSON.stringify(models)); }
    function saveFavorites() { localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites)); }
    function saveHistory() { 
      localStorage.setItem('cb_dashboard_history', JSON.stringify(history)); 
      updateHistoryMenu();
    }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.unshift(username);
        saveModels();
      }
      history = [username, ...history.filter(h => h.toLowerCase() !== lower)];
      saveHistory();
      renderGrid();
    }

    window.toggleFavorite = function(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    };

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);

      const card = document.createElement('div');
      card.className = 'model-card';

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <div class="header-actions">
            <button class="btn-fav ${isFav ? 'is-favorite' : ''}" title="Mettre en favori" onclick="toggleFavorite('${username}')">&#9733;</button>
            <button class="btn-delete" title="Supprimer" onclick="removeModel('${username}')">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
          </iframe>
        </div>
      `;
      return card;
    }

    function renderGrid() {
      grid.innerHTML = '';
      
      let displayModels = [...models].sort((a, b) => {
        const aFav = favorites.includes(a.toLowerCase());
        const bFav = favorites.includes(b.toLowerCase());
        return bFav - aFav;
      });

      if (showOnlyFavorites) {
        displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      }

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">${showOnlyFavorites ? 'Aucun favori enregistré.' : 'Aucun modèle affiché. Utilisez le champ ci-dessus pour ajouter un pseudo.'}</div>`;
        updateHistoryMenu();
        return;
      }

      displayModels.forEach(username => {
        grid.appendChild(createCard(username));
      });

      updateHistoryMenu();
    }

    function removeSingleHistory(username) {
      const lower = username.toLowerCase();
      history = history.filter(h => h.toLowerCase() !== lower);
      saveHistory();
    }

    function updateHistoryMenu() {
      historyCount.textContent = `(${history.length})`;
      historyList.innerHTML = '';

      if (history.length === 0) {
        historyList.innerHTML = '<div style="padding: 12px; font-size: 0.8rem; color: #64748b; text-align: center;">Historique vide</div>';
        return;
      }

      history.forEach(username => {
        const lower = username.toLowerCase();
        const isPresent = models.map(m => m.toLowerCase()).includes(lower);

        const item = document.createElement('div');
        item.className = 'history-item';
        
        item.innerHTML = `
          <span class="history-username" title="${isPresent ? 'Déjà affiché' : 'Cliquer pour réajouter'}">${username}</span>
          <div class="history-actions">
            ${isPresent ? '<span class="badge-added">Actif</span>' : ''}
            <button class="btn-remove-hist" title="Supprimer de l'historique">&times;</button>
          </div>
        `;

        const nameSpan = item.querySelector('.history-username');
        if (!isPresent) {
          nameSpan.addEventListener('click', () => {
            addModelToState(username);
          });
        }

        const deleteBtn = item.querySelector('.btn-remove-hist');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeSingleHistory(username);
        });

        historyList.appendChild(item);
      });
    }

    function positionHistoryMenu() {
      historyMenu.style.left = 'auto';
      historyMenu.style.right = '0';

      const rect = historyMenu.getBoundingClientRect();
      const viewportWidth = window.innerWidth;

      if (rect.right > viewportWidth - 10) {
        historyMenu.style.right = '0';
      }
      if (rect.left < 10) {
        historyMenu.style.right = 'auto';
        historyMenu.style.left = '0';
      }
    }

    historyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = historyMenu.classList.contains('show');
      
      if (!isVisible) {
        historyMenu.classList.add('show');
        positionHistoryMenu();
      } else {
        historyMenu.classList.remove('show');
      }
    });

    document.addEventListener('click', () => {
      historyMenu.classList.remove('show');
    });

    historyMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username) {
        addModelToState(username);
        newModelInput.value = '';
      }
    });

    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      saveModels();
      renderGrid();
    };

    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      renderGrid();
    });

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;

      if (nonFavsCount === 0) {
        alert('Aucun modèle non-favori à supprimer.');
        return;
      }

      if (confirm('Voulez-vous supprimer tous les modèles qui ne sont pas marqués en favoris ?')) {
        models = models.filter(m => favorites.includes(m.toLowerCase()));
        saveModels();
        renderGrid();
      }
    });

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Voulez-vous effacer l\'historique complet des pseudos enregistrés ?')) {
        history = [];
        saveHistory();
      }
    });

    renderGrid();
  </script>
</body>
</html>
