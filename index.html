<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #dc2626;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 1.4rem; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name {
      font-weight: bold;
      font-size: 1rem;
    }

    /* Statut En Direct */
    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    /* Statut Hors Ligne */
    .offline-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #ef4444;
      font-weight: bold;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    /* Conteneur et iframe fixe */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    .offline-placeholder {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    const grid = document.getElementById('grid');

    // 1. Initialisation de la grille
    models.forEach(username => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.setAttribute('draggable', 'false');

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <span class="status-container" id="status-${username}">
            <span class="offline-status" style="color:#94a3b8"><span class="offline-dot" style="background-color:#94a3b8"></span> VÉRIFICATION...</span>
          </span>
        </div>
        <div class="player-container" id="player-${username}">
          <span class="offline-placeholder">Vérification de la diffusion...</span>
        </div>
      `;
      grid.appendChild(card);
    });

    // 2. Fonction d'interrogation de l'API Chaturbate
    async function checkOnlineStatus() {
      try {
        // Utilisation d'un proxy CORS pour interroger l'API publique
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://chaturbate.com/api/public/affiliates/onlinemodels/?wm=welcome&format=json'));
        const data = await response.json();

        // Récupération de la liste des modèles actuellement en ligne
        const onlineUsernames = new Set(data.map(m => m.username.toLowerCase()));

        models.forEach(username => {
          const isOnline = onlineUsernames.has(username.toLowerCase());
          const statusEl = document.getElementById(`status-${username}`);
          const playerEl = document.getElementById(`player-${username}`);

          if (isOnline) {
            statusEl.innerHTML = `<span class="live-status"><span class="live-dot"></span> EN DIRECT</span>`;
            playerEl.innerHTML = `
              <iframe 
                src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
                allow="autoplay; fullscreen" 
                sandbox="allow-scripts allow-same-origin allow-forms"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
                draggable="false">
              </iframe>
            `;
          } else {
            statusEl.innerHTML = `<span class="offline-status"><span class="offline-dot"></span> HORS LIGNE</span>`;
            playerEl.innerHTML = `<span class="offline-placeholder">Modèle actuellement hors ligne</span>`;
          }
        });
      } catch (err) {
        console.error('Erreur lors de la vérification du statut :', err);
      }
    }

    // Exécution au chargement
    checkOnlineStatus();

    // Actualisation automatique du statut toutes les 60 secondes
    setInterval(checkOnlineStatus, 60000);

    // Blocage du glisser-déposer
    window.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
</body>
</html>
