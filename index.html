<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
      --hidden: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-form {
      display: flex;
      align-items: center;
    }

    .custom-input {
      padding: 6px 10px;
      border-radius: 6px 0 0 6px;
      border: 1px solid var(--border);
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 110px;
      transition: width 0.2s ease, border-color 0.2s ease;
    }

    .custom-input:focus {
      border-color: var(--accent);
      width: 140px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      height: 32px;
    }

    .btn-action:hover {
      color: var(--text);
      background: var(--border);
    }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 700;
      padding: 6px 12px;
      height: 32px;
    }

    .btn-add:hover {
      background: #0369a1;
      border-color: #0369a1;
    }

    .btn-reset:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-fav-filter.active {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--star);
      color: var(--star);
      font-weight: 600;
    }

    .btn-hide-toggle.active {
      background: rgba(148, 163, 184, 0.2);
      border-color: var(--hidden);
      color: var(--text);
      font-weight: 600;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      height: 32px;
      transition: border-color 0.2s ease;
    }

    .select-tag:focus, .select-tag:hover {
      border-color: var(--accent);
    }

    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: fixed;
      width: 280px;
      max-width: calc(100vw - 20px);
      max-height: 380px;
      overflow-y: auto;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      z-index: 2000;
      flex-direction: column;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-header {
      padding: 10px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .history-list-container {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      transition: background 0.15s ease;
      gap: 8px;
    }

    .history-item:hover {
      background: #283548;
    }

    .history-username {
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-username:hover {
      color: var(--accent);
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-added {
      font-size: 0.7rem;
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #64748b;
    }

    .btn-remove-hist {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .btn-remove-hist:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .btn-clear-history {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--danger);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      position: sticky;
      bottom: 0;
      z-index: 5;
    }

    .btn-clear-history:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
      font-size: 0.95rem;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }

    .model-card.is-hidden {
      opacity: 0.45;
      border-style: dashed;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .model-info-area {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }

    .model-name {
      font-weight: 600;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tags-wrapper {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag-badge {
      font-size: 0.68rem;
      background: #334155;
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tag-badge:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-card-icon {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .btn-card-icon:hover {
      color: var(--text);
      background: #334155;
    }

    .btn-card-icon.is-favorite {
      color: var(--star);
    }

    .btn-card-icon.is-hidden-btn {
      color: var(--accent);
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .player-container iframe {
      position: absolute;
      top: -11%;
      left: -1%;
      width: 138%;
      height: 122%;
      border: 0;
    }

    .context-menu {
      display: none;
      position: fixed;
      z-index: 3000;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      padding: 4px 0;
      width: 190px;
    }

    .context-menu.show {
      display: block;
    }

    .context-item {
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .context-item:hover {
      background: #334155;
    }

    .context-item.danger {
      color: var(--danger);
    }

    @media (max-width: 600px) {
      header {
        padding: 8px 10px;
      }
      h1 {
        display: none;
      }
      .controls-wrapper {
        width: 100%;
        justify-content: space-between;
      }
      .custom-input {
        width: 90px;
      }
      .custom-input:focus {
        width: 110px;
      }
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live</h1>
    <div class="controls-wrapper">
      <!-- Add Model Input Form -->
      <form id="addModelForm" class="input-form">
        <input 
          type="text" 
          id="newModelInput" 
          class="custom-input" 
          placeholder="Pseudo..." 
          required
        >
        <button type="submit" class="btn-action btn-add" title="Ajouter ce modèle">+</button>
      </form>

      <!-- Tag Filter Dropdown (With Count) -->
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ Étiquettes (Toutes)</option>
      </select>

      <!-- Toggle Hidden Models Button -->
      <button id="hideToggleBtn" class="btn-action btn-hide-toggle" title="Afficher/Masquer les modèles masqués">
        🙈 <span id="hiddenCount">(0)</span>
      </button>

      <!-- Favorites Filter Button -->
      <button id="favFilterBtn" class="btn-action btn-fav-filter" title="Afficher uniquement les favoris">★</button>

      <!-- History Dropdown Menu -->
      <div class="dropdown">
        <button id="historyBtn" class="btn-action" title="Historique des modèles">
          📜 <span id="historyCount">(0)</span>
        </button>
        <div id="historyMenu" class="dropdown-menu">
          <div class="dropdown-header">Pseudos récents</div>
          <div id="historyList" class="history-list-container"></div>
          <button id="clearHistoryBtn" class="btn-clear-history">Vider l'historique</button>
        </div>
      </div>

      <!-- Clean Non-Favorites Button -->
      <button id="resetBtn" class="btn-action btn-reset" title="Supprimer tous les modèles non-favoris">🧹</button>
    </div>
  </header>

  <main class="grid-container" id="grid"></main>

  <!-- Right Click Context Menu -->
  <div id="contextMenu" class="context-menu">
    <div class="context-item" id="ctxFav">⭐ Favori</div>
    <div class="context-item" id="ctxTag">🏷️ Ajouter étiquette...</div>
    <div class="context-item" id="ctxHide">🙈 Masquer</div>
    <div class="context-item danger" id="ctxDelete">❌ Supprimer</div>
  </div>

  <script>
    let models = JSON.parse(localStorage.getItem('cb_dashboard_models')) || [];
    let favorites = JSON.parse(localStorage.getItem('cb_dashboard_favs')) || [];
    let hiddenModels = JSON.parse(localStorage.getItem('cb_dashboard_hidden')) || [];
    let history = JSON.parse(localStorage.getItem('cb_dashboard_history')) || [];
    let tagsMap = JSON.parse(localStorage.getItem('cb_dashboard_tags')) || {};

    let showOnlyFavorites = false;
    let showHiddenModels = false;
    let selectedTagFilter = '';
    let contextUser = null;

    // DOM Elements
    const grid = document.getElementById('grid');
    const addModelForm = document.getElementById('addModelForm');
    const newModelInput = document.getElementById('newModelInput');
    const resetBtn = document.getElementById('resetBtn');
    const favFilterBtn = document.getElementById('favFilterBtn');
    const hideToggleBtn = document.getElementById('hideToggleBtn');
    const hiddenCount = document.getElementById('hiddenCount');
    const tagFilterSelect = document.getElementById('tagFilterSelect');
    const historyBtn = document.getElementById('historyBtn');
    const historyMenu = document.getElementById('historyMenu');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const contextMenu = document.getElementById('contextMenu');

    function saveModels() { localStorage.setItem('cb_dashboard_models', JSON.stringify(models)); }
    function saveFavorites() { localStorage.setItem('cb_dashboard_favs', JSON.stringify(favorites)); }
    function saveHidden() { 
      localStorage.setItem('cb_dashboard_hidden', JSON.stringify(hiddenModels)); 
      updateHiddenCount();
    }
    function saveHistory() { 
      localStorage.setItem('cb_dashboard_history', JSON.stringify(history)); 
      updateHistoryMenu();
    }
    function saveTagsMap() { localStorage.setItem('cb_dashboard_tags', JSON.stringify(tagsMap)); }

    function addModelToState(username) {
      const lower = username.toLowerCase();
      if (!models.map(m => m.toLowerCase()).includes(lower)) {
        models.unshift(username);
        saveModels();
      }
      history = [username, ...history.filter(h => h.toLowerCase() !== lower)];
      saveHistory();
      renderGrid();
    }

    function toggleFavorite(username) {
      const lower = username.toLowerCase();
      if (favorites.includes(lower)) {
        favorites = favorites.filter(f => f !== lower);
      } else {
        favorites.push(lower);
      }
      saveFavorites();
      renderGrid();
    }

    function toggleHideModel(username) {
      const lower = username.toLowerCase();
      if (hiddenModels.includes(lower)) {
        hiddenModels = hiddenModels.filter(h => h !== lower);
      } else {
        hiddenModels.push(lower);
      }
      saveHidden();
      renderGrid();
    }

    function addTagToModel(username, tag) {
      const lower = username.toLowerCase();
      const cleanTag = tag.trim().toLowerCase();
      if (!cleanTag) return;
      
      const current = tagsMap[lower] || [];
      if (!current.includes(cleanTag)) {
        tagsMap[lower] = [...current, cleanTag];
        saveTagsMap();
        renderGrid();
      }
    }

    function removeTagFromModel(username, tagToRemove) {
      const lower = username.toLowerCase();
      if (tagsMap[lower]) {
        tagsMap[lower] = tagsMap[lower].filter(t => t !== tagToRemove);
        if (tagsMap[lower].length === 0) {
          delete tagsMap[lower];
        }
        saveTagsMap();
        renderGrid();
      }
    }

    function updateTagFilterOptions() {
      // Calculate model count per tag
      const counts = {};
      Object.values(tagsMap).forEach(tagList => {
        tagList.forEach(t => {
          counts[t] = (counts[t] || 0) + 1;
        });
      });

      const totalTagsCount = Object.keys(counts).length;
      tagFilterSelect.innerHTML = `<option value="">🏷️ Étiquettes (${totalTagsCount})</option>`;

      const sortedTags = Object.keys(counts).sort();
      sortedTags.forEach(tag => {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = `🏷️ ${tag} (${counts[tag]})`;
        if (tag === selectedTagFilter) {
          opt.selected = true;
        }
        tagFilterSelect.appendChild(opt);
      });
    }

    function updateHiddenCount() {
      const count = models.filter(m => hiddenModels.includes(m.toLowerCase())).length;
      hiddenCount.textContent = `(${count})`;
    }

    function createCard(username) {
      const lower = username.toLowerCase();
      const isFav = favorites.includes(lower);
      const isHidden = hiddenModels.includes(lower);
      const modelTags = tagsMap[lower] || [];

      const card = document.createElement('div');
      card.className = `model-card ${isHidden ? 'is-hidden' : ''}`;

      card.innerHTML = `
        <div class="model-header">
          <div class="model-info-area">
            <span class="model-name" title="${username}">${username}</span>
            <div class="tags-wrapper"></div>
          </div>
          <div class="header-actions">
            <button class="btn-card-icon btn-add-tag" title="Ajouter une étiquette">🏷️</button>
            <button class="btn-card-icon ${isHidden ? 'is-hidden-btn' : ''}" title="${isHidden ? 'Démasquer' : 'Masquer'}">🙈</button>
            <button class="btn-card-icon ${isFav ? 'is-favorite' : ''}" title="Mettre en favori">&#9733;</button>
            <button class="btn-card-icon btn-delete" title="Supprimer">&times;</button>
          </div>
        </div>
        <div class="player-container">
          <iframe 
            src="https://chaturbate.com/embed/${encodeURIComponent(username)}/" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
          </iframe>
        </div>
      `;

      // Render tags inside wrapper
      const tagsWrapper = card.querySelector('.tags-wrapper');
      modelTags.forEach(tag => {
        const badge = document.createElement('span');
        badge.className = 'tag-badge';
        badge.title = 'Cliquer pour supprimer cette étiquette';
        badge.innerHTML = `${tag} &times;`;
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          removeTagFromModel(username, tag);
        });
        tagsWrapper.appendChild(badge);
      });

      // Event bindings for action buttons
      card.querySelector('.btn-add-tag').addEventListener('click', () => {
        const inputTag = prompt(`Ajouter une étiquette pour ${username} :`);
        if (inputTag) addTagToModel(username, inputTag);
      });

      const hideBtn = card.querySelectorAll('.btn-card-icon')[1];
      hideBtn.addEventListener('click', () => toggleHideModel(username));

      const favBtn = card.querySelectorAll('.btn-card-icon')[2];
      favBtn.addEventListener('click', () => toggleFavorite(username));

      card.querySelector('.btn-delete').addEventListener('click', () => removeModel(username));

      // Right-click context menu event
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        contextUser = username;
        
        document.getElementById('ctxFav').textContent = isFav ? '⭐ Retirer Favori' : '⭐ Ajouter Favori';
        document.getElementById('ctxHide').textContent = isHidden ? '👁️ Démasquer' : '🙈 Masquer';
        
        contextMenu.style.top = `${e.clientY}px`;
        contextMenu.style.left = `${e.clientX}px`;
        contextMenu.classList.add('show');
      });

      return card;
    }

    function renderGrid() {
      grid.innerHTML = '';
      updateTagFilterOptions();
      updateHiddenCount();

      let displayModels = [...models].sort((a, b) => {
        const aFav = favorites.includes(a.toLowerCase());
        const bFav = favorites.includes(b.toLowerCase());
        return bFav - aFav;
      });

      if (!showHiddenModels) {
        displayModels = displayModels.filter(m => !hiddenModels.includes(m.toLowerCase()));
      }

      if (showOnlyFavorites) {
        displayModels = displayModels.filter(m => favorites.includes(m.toLowerCase()));
      }

      if (selectedTagFilter) {
        displayModels = displayModels.filter(m => {
          const mTags = tagsMap[m.toLowerCase()] || [];
          return mTags.includes(selectedTagFilter);
        });
      }

      if (displayModels.length === 0) {
        grid.innerHTML = `<div class="empty-message">Aucun modèle ne correspond aux filtres sélectionnés.</div>`;
        updateHistoryMenu();
        return;
      }

      displayModels.forEach(username => {
        grid.appendChild(createCard(username));
      });

      updateHistoryMenu();
    }

    function removeSingleHistory(username) {
      const lower = username.toLowerCase();
      history = history.filter(h => h.toLowerCase() !== lower);
      saveHistory();
    }

    function updateHistoryMenu() {
      historyCount.textContent = `(${history.length})`;
      historyList.innerHTML = '';

      if (history.length === 0) {
        historyList.innerHTML = '<div style="padding: 16px; font-size: 0.8rem; color: #64748b; text-align: center;">Historique vide</div>';
        return;
      }

      history.forEach(username => {
        const lower = username.toLowerCase();
        const isPresent = models.map(m => m.toLowerCase()).includes(lower);

        const item = document.createElement('div');
        item.className = 'history-item';
        
        item.innerHTML = `
          <span class="history-username" title="${isPresent ? 'Déjà affiché' : 'Cliquer pour réajouter'}">${username}</span>
          <div class="history-actions">
            ${isPresent ? '<span class="badge-added">Actif</span>' : ''}
            <button class="btn-remove-hist" title="Supprimer de l'historique">&times;</button>
          </div>
        `;

        const nameSpan = item.querySelector('.history-username');
        if (!isPresent) {
          nameSpan.addEventListener('click', () => {
            addModelToState(username);
          });
        }

        const deleteBtn = item.querySelector('.btn-remove-hist');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeSingleHistory(username);
        });

        historyList.appendChild(item);
      });
    }

    function positionHistoryMenuStrictly() {
      if (!historyMenu.classList.contains('show')) return;

      const btnRect = historyBtn.getBoundingClientRect();
      const padding = 10;
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      historyMenu.style.top = '0px';
      historyMenu.style.left = '0px';
      historyMenu.style.maxHeight = `${viewportHeight - 20}px`;

      const menuRect = historyMenu.getBoundingClientRect();

      let top = btnRect.bottom + 6;
      if (top + menuRect.height > viewportHeight - padding) {
        top = Math.max(padding, btnRect.top - menuRect.height - 6);
      }

      let left = btnRect.right - menuRect.width;
      if (left < padding) left = padding;
      if (left + menuRect.width > viewportWidth - padding) {
        left = viewportWidth - padding - menuRect.width;
      }

      historyMenu.style.top = `${top}px`;
      historyMenu.style.left = `${left}px`;
    }

    historyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = historyMenu.classList.contains('show');
      
      if (!isVisible) {
        historyMenu.classList.add('show');
        positionHistoryMenuStrictly();
      } else {
        historyMenu.classList.remove('show');
      }
    });

    document.addEventListener('click', () => {
      historyMenu.classList.remove('show');
      contextMenu.classList.remove('show');
    });

    historyMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    window.addEventListener('resize', () => {
      positionHistoryMenuStrictly();
    });

    window.addEventListener('scroll', () => {
      positionHistoryMenuStrictly();
    }, true);

    tagFilterSelect.addEventListener('change', (e) => {
      selectedTagFilter = e.target.value;
      renderGrid();
    });

    hideToggleBtn.addEventListener('click', () => {
      showHiddenModels = !showHiddenModels;
      hideToggleBtn.classList.toggle('active', showHiddenModels);
      renderGrid();
    });

    addModelForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = newModelInput.value.trim();

      if (username) {
        addModelToState(username);
        newModelInput.value = '';
      }
    });

    window.removeModel = function(username) {
      const lower = username.toLowerCase();
      models = models.filter(m => m.toLowerCase() !== lower);
      saveModels();
      renderGrid();
    };

    favFilterBtn.addEventListener('click', () => {
      showOnlyFavorites = !showOnlyFavorites;
      favFilterBtn.classList.toggle('active', showOnlyFavorites);
      renderGrid();
    });

    resetBtn.addEventListener('click', () => {
      const nonFavsCount = models.filter(m => !favorites.includes(m.toLowerCase())).length;
      if (nonFavsCount === 0) return;

      models = models.filter(m => favorites.includes(m.toLowerCase()));
      saveModels();
      renderGrid();
    });

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      saveHistory();
    });

    // Context Menu Handlers
    document.getElementById('ctxFav').addEventListener('click', () => {
      if (contextUser) toggleFavorite(contextUser);
    });

    document.getElementById('ctxHide').addEventListener('click', () => {
      if (contextUser) toggleHideModel(contextUser);
    });

    document.getElementById('ctxTag').addEventListener('click', () => {
      if (contextUser) {
        const inputTag = prompt(`Ajouter une étiquette pour ${contextUser} :`);
        if (inputTag) addTagToModel(contextUser, inputTag);
      }
    });

    document.getElementById('ctxDelete').addEventListener('click', () => {
      if (contextUser) removeModel(contextUser);
    });

    // Initial render call
    renderGrid();
  </script>
</body>
</html>
