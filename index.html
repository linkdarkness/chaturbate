<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Flux Pur</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.4rem; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .model-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .model-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .model-name { font-weight: bold; }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #22c55e;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Directs Live (Flux Vidéo Brut)</h1>
    <span id="loading-status" style="color: #94a3b8; font-size: 0.9rem;">Analyse des serveurs...</span>
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const models = [
      'dreamsweetgirl',
      'cutefacebigass',
      'sweet_sugar87',
      'ellyrockstar',
      'pinkcouplexo',
      'julcy_peach',
      'shiny_lily',
      'olsenspring',
      'holly_and_honey_69',
      'naughty_pearls'
    ];

    const grid = document.getElementById('grid');
    const statusText = document.getElementById('loading-status');
    let liveCount = 0;
    let processed = 0;

    // Fonction pour interroger le serveur WebSocket de la room
    function getStreamUrl(username) {
      return new Promise((resolve, reject) => {
        const ws = new WebSocket(`wss://edge1-external.chaturbate.com/ws/${username}/`);
        const timeout = setTimeout(() => {
          ws.close();
          reject('Timeout');
        }, 4000);

        ws.onopen = () => {
          ws.send(JSON.stringify({ exec: 'subscribe', data: { room: username } }));
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.data && msg.data.hls_source) {
              clearTimeout(timeout);
              ws.close();
              resolve(msg.data.hls_source);
            }
          } catch (e) {}
        };

        ws.onerror = (err) => {
          clearTimeout(timeout);
          reject(err);
        };
      });
    }

    async function init() {
      grid.innerHTML = '';

      for (const username of models) {
        try {
          const m3u8Url = await getStreamUrl(username);
          if (m3u8Url) {
            liveCount++;
            createVideoCard(username, m3u8Url);
          }
        } catch (err) {
          // Si l'erreur est levée, le modèle est hors ligne ou l'accès est refusé
        }
        processed++;
        statusText.textContent = `Vérification : ${processed}/${models.length}...`;
      }

      statusText.textContent = `${liveCount} modèle(s) en direct`;

      if (liveCount === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Aucun modèle de la liste n'est en direct actuellement (ou accès restreint).</p>`;
      }
    }

    function createVideoCard(username, streamUrl) {
      const card = document.createElement('div');
      card.className = 'model-card';
      const videoId = `video-${username}`;

      card.innerHTML = `
        <div class="model-header">
          <span class="model-name">${username}</span>
          <span class="live-status"><span class="live-dot"></span> EN DIRECT</span>
        </div>
        <div class="player-container">
          <video id="${videoId}" controls autoplay muted playsinline></video>
        </div>
      `;

      grid.appendChild(card);
      const videoElement = document.getElementById(videoId);

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(videoElement);
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = streamUrl;
      }
    }

    init();
  </script>
</body>
</html>
