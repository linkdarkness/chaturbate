<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Live - Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --danger: #ef4444;
      --star: #fbbf24;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .select-tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      width: auto;
      flex-shrink: 0;
      height: 36px;
    }
    .select-tag:hover, .select-tag:focus { border-color: var(--accent); }

    .input-form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 85%;
      position: relative;
    }

    .custom-input {
      padding: 8px 32px 8px 12px;
      border-radius: 6px 0 0 6px;
      border: 1px solid #334155;
      border-right: none;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      height: 38px;
      transition: border-color 0.2s ease;
    }
    .custom-input:focus { border-color: var(--accent); }

    .clear-search-btn {
      position: absolute;
      right: 50px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0 6px;
      line-height: 1;
    }
    .clear-search-btn:hover { color: var(--text); }
    .clear-search-btn.show { display: block; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: 1px solid #0284c7;
      border-radius: 0 6px 6px 0;
      font-weight: 600;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      height: 38px;
    }
    .btn-add:hover { background: #0369a1; border-color: #0369a1; }

    .header-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
      height: 36px;
    }
    .btn-action:hover { color: var(--text); background: #334155; }
    .btn-reset:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-layout.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }
    .btn-nonfav-toggle.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* PLEIN ÉCRAN PLEINEMENT ADAPTÉ AUX RATIOS (VIGNETTES & STANDARD) */
    .player-container:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto !important;
    }
    .player-container:fullscreen iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
      transform: none !important;
    }
    .player-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto !important;
    }
    .player-container:-webkit-full-screen iframe {
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      position: relative !important;
      top: auto !important;
      left: auto !important;
      transform: none !important;
    }

    /* Volet Non-Favoris */
    .sidebar-container {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transition: left 0.3s ease-in-out;
    }
    .sidebar-container.open { left: 0; }
    
    .sidebar-header {
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .sidebar-close-btn { background: transparent; border: none; color: #64748b; font-size: 1.5rem; cursor: pointer; padding: 2px 8px; }
    .sidebar-close-btn:hover { color: var(--danger); }
    
    .sidebar-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Grille principale */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
      flex: 1;
      align-content: start;
    }
    
    .grid-container.miniature-mode { 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 8px; 
      padding: 8px; 
    }
    .grid-container.miniature-mode .model-header { padding: 4px 8px; }
    .grid-container.miniature-mode .model-name { font-size: 0.8rem; }
    .grid-container.miniature-mode .tags-container { display: none; }
    
    .grid-container.miniature-mode .player-container { 
      aspect-ratio: 1 / 1; 
      width: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-container.miniature-mode .player-container iframe {
      position: absolute;
      width: 100%;
      height: 56.25%; 
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      border: 0;
    }

    /* VUE LISTE COMPACTE */
    .grid-container.list-mode {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .grid-container.list-mode .model-card {
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 6px;
    }
    .grid-container.list-mode .model-header {
      background: transparent;
      border: none;
      padding: 10px 12px;
      cursor: pointer;
    }
    .grid-container.list-mode .model-header:hover {
      background: rgba(56, 189, 248, 0.05);
    }
    .grid-container.list-mode .player-container {
      display: none;
    }
    .grid-container.list-mode .model-card.expanded .player-container {
      display: block;
      border-top: 1px solid #334155;
    }

    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-message { text-align: center; padding: 60px 20px; color: #64748b; font-size: 1rem; width: 100%; }

    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 100%;
    }

    .model-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .model-title-area { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
    .model-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .tags-container { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-badge {
      font-size: 0.7rem; background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-badge:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-icon-subtle { background: transparent; border: none; color: #64748b; font-size: 1rem; cursor: pointer; padding: 2px 4px; }
    .btn-icon-subtle:hover { color: var(--text); }
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; }
    .btn-fav:hover, .btn-fav.is-favorite { color: var(--star); }
    .btn-delete { background: transparent; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 2px 4px; }
    .btn-delete:hover { color: var(--danger); }

    .player-container { 
      width: 100%; 
      aspect-ratio: 16 / 9; 
      background: #000; 
      position: relative; 
      overflow: hidden; 
      display: block; 
      flex-shrink: 0;
    }
    .player-container iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0; 
      display: block; 
    }

    /* Modal générique & Albums photos */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); z-index: 3000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .modal-input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; }
    
    .existing-tags-suggestions {
      display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto; padding: 4px 0;
    }
    .suggestion-tag-btn {
      background: #334155; color: var(--accent); border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;
    }
    .suggestion-tag-btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Styles spécifiques Album Photos (Gestion par dossier) */
    .album-modal-card {
      width: 95%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .album-body {
      overflow-y: auto;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
    }
    .album-folder-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .album-folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .album-folder-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .album-folder-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-folder-action {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-folder-action:hover { color: var(--text); background: #334155; }
    .btn-folder-action.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .btn-folder-action.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: var(--accent); }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }
    .album-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #000;
      cursor: pointer;
    }
    .album-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .album-item:hover img { transform: scale(1.05); }
    
    .album-item-checkbox {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      display: none;
      z-index: 2;
    }
    .album-folder-section.select-mode .album-item-checkbox {
      display: block;
    }
    .album-item.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }

    .album-item-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--danger);
      border: none;
      border-radius: 4px;
      width: 22px;
      height: 22px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .album-folder-section.select-mode .album-item-delete { display: none !important; }
    .album-item:hover .album-item-delete { opacity: 1; }
    .album-item-delete:hover { background: var(--danger); color: #fff; }

    /* Barre de sélection multiple bas de dossier */
    .folder-bulk-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .album-folder-section.select-mode .folder-bulk-bar {
      display: flex;
    }

    /* Visionneuse plein écran d'une photo */
    .lightbox-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 4000; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <button id="nonFavSidebarBtn" class="btn-action btn-nonfav-toggle" title="Modèles hors favoris" style="width: auto; flex-shrink: 0; height: 36px;">📁 <span id="nonFavCount">(0)</span></button>

      <form id="addModelForm" class="input-form" style="width: 85%;">
        <input type="text" id="newModelInput" class="custom-input" placeholder="Ajouter un pseudo..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Effacer la recherche">&times;</button>
        <button type="submit" class="btn-add" title="Ajouter ce modèle">+</button>
      </form>
    </div>

    <div class="header-bottom-row">
      <select id="tagFilterSelect" class="select-tag" title="Filtrer par étiquette">
        <option value="">🏷️ (Tous)</option>
      </select>

      <button id="layoutToggleBtn" class="btn-action btn-layout" title="Changer le mode d'affichage">⚏</button>
      <button id="exportBtn" class="btn-action" title="Exporter la configuration (JSON)">📥</button>
      <button id="importBtn" class="btn-action" title="Importer une configuration (JSON)">📤</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
      
      <button id="resetBtn" class
